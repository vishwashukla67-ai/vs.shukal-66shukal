<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saffron Table &mdash; Catering Billing &amp; GST Invoicing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#F5F3EE;
  --surface:#FFFFFF;
  --ink:#1B2B24;
  --ink-soft:#5B6B62;
  --line:#E4E0D6;
  --primary:#1B4332;
  --primary-dark:#0F2A1E;
  --primary-light:#2D6A4F;
  --gold:#B8892B;
  --gold-light:#EFD9A3;
  --success:#2F7A4F;
  --success-bg:#E7F3EB;
  --warn:#B4650F;
  --warn-bg:#FBEEDD;
  --danger:#B3261E;
  --danger-bg:#FBE9E7;
  --mono:'JetBrains Mono',monospace;
  --display:'Fraunces',serif;
  --body:'Inter',sans-serif;
  --radius:10px;
  --shadow:0 1px 2px rgba(15,42,30,.06),0 4px 16px rgba(15,42,30,.05);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--body);
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  font-size:14px;
}
::selection{background:var(--gold-light);}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}

.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(15,26,20,.5);z-index:140;}
.sidebar-backdrop.show{display:block;}
.hamburger-btn{
  display:none;width:34px;height:34px;flex-shrink:0;align-items:center;justify-content:center;
  border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);
}
.hamburger-btn svg{width:18px;height:18px;}

/* ---------- Layout ---------- */
#app{display:flex;min-height:100vh;}
.sidebar{
  width:236px;flex-shrink:0;
  background:linear-gradient(180deg,var(--primary-dark),var(--primary) 70%);
  color:#EAF3EC;
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.brand{
  padding:22px 20px 16px;
  border-bottom:1px solid rgba(255,255,255,.12);
}
.brand-mark{
  font-family:var(--display);font-weight:600;font-size:21px;letter-spacing:.2px;color:#fff;
  display:flex;align-items:center;gap:9px;
}
.brand-mark .dot{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px rgba(184,137,43,.25);}
.brand-sub{font-size:10.5px;color:#B9CFC1;letter-spacing:1.4px;text-transform:uppercase;margin-top:5px;padding-left:18px;}
.nav{padding:14px 10px;flex:1;overflow-y:auto;}
.nav-group-label{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:#8FAE9C;margin:16px 12px 6px;font-weight:600;}
.nav-group-label:first-child{margin-top:4px;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;border-radius:8px;margin:1px 0;
  color:#D7E6DC;font-size:13.3px;font-weight:500;
  border:none;background:none;width:100%;text-align:left;
}
.nav-item svg{width:16px;height:16px;opacity:.85;flex-shrink:0;}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff;}
.nav-item.active{background:rgba(184,137,43,.22);color:#fff;box-shadow:inset 2px 0 0 var(--gold);}
.sidebar-foot{padding:14px 20px;border-top:1px solid rgba(255,255,255,.1);font-size:11px;color:#8FAE9C;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  height:62px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20;
}
.topbar-title{font-family:var(--display);font-size:19px;font-weight:600;color:var(--ink);}
.topbar-title .eyebrow{display:block;font-family:var(--body);font-size:11px;color:var(--ink-soft);font-weight:600;letter-spacing:.6px;text-transform:uppercase;margin-bottom:1px;}
.search-wrap{position:relative;width:280px;}
.search-wrap input{
  width:100%;padding:8px 12px 8px 34px;border-radius:8px;border:1px solid var(--line);background:var(--bg);
  font-size:13px;color:var(--ink);outline:none;
}
.search-wrap input:focus{border-color:var(--primary-light);background:#fff;}
.search-wrap svg{position:absolute;left:11px;top:9px;width:15px;height:15px;color:var(--ink-soft);}
.topbar-right{display:flex;align-items:center;gap:14px;}
.today-pill{font-size:12px;color:var(--ink-soft);background:var(--bg);padding:6px 12px;border-radius:20px;border:1px solid var(--line);}

.content{padding:24px 28px 60px;}
.page{display:none;}
.page.active{display:block;animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:9px 15px;border-radius:8px;border:1px solid transparent;
  font-size:13px;font-weight:600;line-height:1;transition:.15s;white-space:nowrap;
}
.btn svg{width:14px;height:14px;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-gold{background:var(--gold);color:#fff;}
.btn-gold:hover{filter:brightness(.94);}
.btn-outline{background:#fff;border-color:var(--line);color:var(--ink);}
.btn-outline:hover{border-color:var(--primary);color:var(--primary);}
.btn-ghost{background:transparent;color:var(--ink-soft);border:none;}
.btn-ghost:hover{color:var(--ink);background:var(--bg);}
.btn-danger-outline{background:#fff;border-color:var(--danger);color:var(--danger);}
.btn-danger-outline:hover{background:var(--danger-bg);}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:7px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.icon-btn{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--ink-soft);}
.icon-btn:hover{color:var(--primary);border-color:var(--primary);}
.icon-btn svg{width:14px;height:14px;}

/* ---------- Cards / KPIs ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.kpi{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--kpi-accent,var(--primary));}
.kpi-label{font-size:11.5px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
.kpi-value{font-family:var(--display);font-size:24px;font-weight:600;margin-top:6px;color:var(--ink);}
.kpi-sub{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}
.kpi-sub.up{color:var(--success);}
.kpi-sub.down{color:var(--danger);}

.charts-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-bottom:20px;}
.charts-grid-3{display:grid;grid-template-columns:1fr;gap:14px;}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.panel-title{font-family:var(--display);font-size:15.5px;font-weight:600;}
.panel-title .n{color:var(--gold);}
.chart-box{position:relative;height:230px;}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

/* ---------- Section header ---------- */
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.section-head h2{font-family:var(--display);font-size:22px;font-weight:600;margin:0;}
.section-head .desc{font-size:12.5px;color:var(--ink-soft);margin-top:3px;}
.section-actions{display:flex;gap:8px;flex-wrap:wrap;}

.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;flex-wrap:wrap;}
.toolbar-left{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.toolbar input[type=text],.toolbar input[type=search]{padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;min-width:200px;background:#fff;}
.toolbar select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;background:#fff;}

/* ---------- Tables ---------- */
.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
table{width:100%;border-collapse:collapse;font-size:12.8px;}
thead th{
  text-align:left;padding:10px 14px;background:#F1EEE6;color:var(--ink-soft);
  font-weight:700;font-size:10.8px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--line);
  white-space:nowrap;
}
tbody td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#FBFAF6;}
td.num,th.num{text-align:right;font-family:var(--mono);}
.row-actions{display:flex;gap:6px;justify-content:flex-end;}
.empty-state{padding:56px 20px;text-align:center;color:var(--ink-soft);}
.empty-state svg{width:38px;height:38px;color:var(--line);margin-bottom:10px;}
.empty-state .t{font-weight:600;color:var(--ink);font-size:14px;margin-bottom:3px;}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.2px;}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
.badge-success{background:var(--success-bg);color:var(--success);}
.badge-warn{background:var(--warn-bg);color:var(--warn);}
.badge-danger{background:var(--danger-bg);color:var(--danger);}
.badge-muted{background:#EEECE4;color:var(--ink-soft);}
.badge-gold{background:#FBF1DC;color:var(--gold);}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,26,20,.55);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:40px 20px;overflow-y:auto;}
.overlay.show{display:flex;}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:modalIn .2s ease;margin-bottom:40px;}
.modal.wide{max-width:900px;}
@keyframes modalIn{from{opacity:0;transform:translateY(-10px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line);}
.modal-head h3{font-family:var(--display);font-size:17px;font-weight:600;margin:0;}
.modal-close{background:none;border:none;font-size:20px;color:var(--ink-soft);line-height:1;padding:4px;}
.modal-close:hover{color:var(--ink);}
.modal-body{padding:20px 22px;max-height:70vh;overflow-y:auto;}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:16px 22px;border-top:1px solid var(--line);}

/* ---------- Forms ---------- */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
.form-grid.c3{grid-template-columns:1fr 1fr 1fr;}
.field{display:flex;flex-direction:column;gap:5px;}
.field.full{grid-column:1/-1;}
.field label{font-size:11.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;}
.field label .req{color:var(--danger);}
.field input,.field select,.field textarea{
  padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff;color:var(--ink);outline:none;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary-light);box-shadow:0 0 0 3px rgba(45,106,79,.12);}
.field textarea{resize:vertical;min-height:60px;}
.field .err{font-size:11px;color:var(--danger);display:none;}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--danger);}
.field.invalid .err{display:block;}
.hint{font-size:11px;color:var(--ink-soft);}

/* line items editor */
.line-items{border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.line-items table{font-size:12.3px;}
.line-items th{background:#F1EEE6;}
.line-items input,.line-items select{width:100%;padding:6px 7px;border:1px solid var(--line);border-radius:6px;font-size:12px;}
.line-items td{padding:6px 8px;}

/* ---------- Toasts ---------- */
.toast-stack{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:200;}
.toast{
  background:var(--ink);color:#fff;padding:12px 16px;border-radius:9px;font-size:12.8px;font-weight:500;
  display:flex;align-items:center;gap:9px;box-shadow:0 8px 24px rgba(0,0,0,.25);min-width:230px;
  animation:toastIn .2s ease;
}
.toast.success{background:var(--primary-dark);}
.toast.error{background:#7A1E17;}
.toast .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);flex-shrink:0;}
@keyframes toastIn{from{opacity:0;transform:translateX(16px);}to{opacity:1;transform:translateX(0);}}

/* ---------- Invoice ---------- */
#invoiceDoc{background:#fff;padding:34px;border-radius:6px;color:#1a1a1a;font-size:12.5px;}
#invoiceDoc .inv-top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--primary);padding-bottom:16px;margin-bottom:16px;}
#invoiceDoc .biz-name{font-family:var(--display);font-size:22px;font-weight:700;color:var(--primary);}
#invoiceDoc .biz-meta{font-size:11.3px;color:#555;line-height:1.6;margin-top:4px;}
#invoiceDoc .inv-badge{text-align:right;}
#invoiceDoc .inv-badge .tag{font-family:var(--display);font-size:20px;font-weight:700;color:var(--gold);letter-spacing:1px;}
#invoiceDoc .inv-badge .num{font-family:var(--mono);font-size:13px;margin-top:3px;}
#invoiceDoc .inv-meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
#invoiceDoc .meta-box{background:#F7F5F0;border-radius:8px;padding:12px 14px;}
#invoiceDoc .meta-box h4{margin:0 0 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:#7a7a7a;}
#invoiceDoc .meta-box .row{display:flex;justify-content:space-between;font-size:12px;padding:2px 0;}
#invoiceDoc table.items{width:100%;border-collapse:collapse;margin-bottom:14px;}
#invoiceDoc table.items th{background:var(--primary);color:#fff;font-size:10.5px;text-transform:uppercase;padding:8px 8px;text-align:left;letter-spacing:.3px;}
#invoiceDoc table.items td{padding:7px 8px;border-bottom:1px solid #eee;font-size:12px;}
#invoiceDoc table.items td.num,#invoiceDoc table.items th.num{text-align:right;}
#invoiceDoc .totals{display:flex;justify-content:flex-end;margin-bottom:14px;}
#invoiceDoc .totals table{width:280px;font-size:12.5px;}
#invoiceDoc .totals td{padding:4px 4px;}
#invoiceDoc .totals td:last-child{text-align:right;font-family:var(--mono);}
#invoiceDoc .totals .grand td{font-weight:700;font-size:15px;border-top:2px solid var(--primary);padding-top:8px;color:var(--primary);}
#invoiceDoc .totals .balance td{font-weight:700;color:var(--danger);}
#invoiceDoc .words{background:#FBF1DC;border-radius:8px;padding:10px 14px;font-size:12px;margin-bottom:14px;}
#invoiceDoc .words b{color:var(--gold);}
#invoiceDoc .foot-grid{display:flex;justify-content:space-between;margin-top:26px;font-size:11px;color:#666;}
#invoiceDoc .sign-box{text-align:center;padding-top:34px;border-top:1px solid #ccc;width:170px;}

/* ---------- Utility ---------- */
.muted{color:var(--ink-soft);}
.gold-text{color:var(--gold);}
.tag-pill{display:inline-block;padding:2px 9px;border-radius:20px;background:#F1EEE6;font-size:11px;color:var(--ink-soft);margin:2px 3px 2px 0;}
.low-stock-row{background:var(--danger-bg) !important;}
.report-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.report-tab{padding:7px 13px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:600;color:var(--ink-soft);}
.report-tab.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.date-filter{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.date-filter button.quick{padding:6px 10px;border-radius:7px;border:1px solid var(--line);background:#fff;font-size:11.5px;color:var(--ink-soft);}
.date-filter button.quick.active{background:var(--gold);border-color:var(--gold);color:#fff;}
.summary-strip{display:flex;gap:14px;margin-bottom:14px;flex-wrap:wrap;}
.summary-chip{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 16px;box-shadow:var(--shadow);}
.summary-chip .l{font-size:10.5px;text-transform:uppercase;color:var(--ink-soft);font-weight:700;letter-spacing:.4px;}
.summary-chip .v{font-family:var(--display);font-size:17px;font-weight:600;margin-top:2px;}

@media print{
  body *{visibility:hidden;}
  #printArea,#printArea *{visibility:visible;}
  #printArea{position:absolute;left:0;top:0;width:100%;}
  .overlay{position:absolute;background:none;padding:0;}
}
html,body{overflow-x:hidden;max-width:100%;}
#app{overflow-x:hidden;}

/* ===== Tablet & below (<=1000px) ===== */
@media (max-width:1000px){
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .charts-grid{grid-template-columns:1fr;}
  .two-col{grid-template-columns:1fr;}
  .form-grid,.form-grid.c3{grid-template-columns:1fr;}
  .sidebar{position:fixed;left:-236px;z-index:150;transition:.2s;}
  .sidebar.open{left:0;box-shadow:0 0 40px rgba(0,0,0,.35);}
  .hamburger-btn{display:inline-flex;}
  .search-wrap{width:160px;}
  .dm-grid{grid-template-columns:1fr !important;}
  #invoiceDoc .inv-meta-grid{grid-template-columns:1fr;}
}

/* ===== Mobile (<=680px) ===== */
@media (max-width:680px){
  body{font-size:13px;}
  .content{padding:14px 12px 40px;}
  .topbar{padding:0 12px;height:56px;}
  .topbar-title{font-size:15.5px;}
  .topbar-title .eyebrow{font-size:9.5px;}
  .topbar-right{gap:8px;}
  .search-wrap{display:none;}
  .today-pill{font-size:10.5px;padding:5px 9px;}

  .kpi-grid{grid-template-columns:1fr 1fr;gap:10px;}
  .kpi{padding:12px 13px;}
  .kpi-value{font-size:19px;}
  .charts-grid,.charts-grid-3{grid-template-columns:1fr;gap:10px;}
  .chart-box{height:200px;}
  .panel{padding:14px 14px;}

  .section-head{flex-direction:column;align-items:flex-start;}
  .section-head h2{font-size:19px;}
  .section-actions{width:100%;}
  .section-actions .btn{flex:1;justify-content:center;}

  .toolbar{flex-direction:column;align-items:stretch;}
  .toolbar-left{flex-direction:column;align-items:stretch;}
  .toolbar input[type=text],.toolbar input[type=search],.toolbar select{min-width:0;width:100%;}

  /* Tables: scroll is contained inside the card, never the page */
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table{font-size:12px;}
  thead th,tbody td{padding:8px 10px;white-space:nowrap;}

  .form-grid,.form-grid.c3{grid-template-columns:1fr;gap:10px;}
  .modal{max-width:96vw;width:96vw;margin:0 auto 20px;border-radius:12px;}
  .modal.wide{max-width:96vw;}
  .modal-body{padding:14px 16px;max-height:75vh;}
  .modal-head,.modal-foot{padding:14px 16px;}
  .modal-foot{flex-wrap:wrap;}
  .modal-foot .btn{flex:1;justify-content:center;}

  .line-items{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .line-items table{font-size:11.5px;}

  .summary-strip{gap:8px;}
  .summary-chip{padding:8px 12px;flex:1 1 auto;min-width:120px;}

  #invoiceDoc{padding:16px;font-size:11.5px;}
  #invoiceDoc .inv-top{flex-direction:column;gap:10px;}
  #invoiceDoc .inv-badge{text-align:left;}
  #invoiceDoc .inv-meta-grid{grid-template-columns:1fr;gap:10px;}
  #invoiceDoc table.items{overflow-x:auto;display:block;}
  #invoiceDoc .totals{justify-content:flex-start;}
  #invoiceDoc .totals table{width:100%;}
  #invoiceDoc .foot-grid{flex-direction:column;gap:16px;}

  .report-tabs{gap:5px;}
  .report-tab{padding:6px 10px;font-size:11px;}
  .date-filter{width:100%;}
}
@media (max-width:400px){
  .kpi-grid{grid-template-columns:1fr;}
}
/* ---------- Notifications ---------- */

function uid(kind){ return state.seq[kind]++; }
function rupee(n){
  n = Number(n)||0;
  const neg = n<0; n=Math.abs(n);
  let [int,dec] = n.toFixed(2).split(".");
  let last3 = int.slice(-3), rest = int.slice(0,-3);
  if(rest!=="") last3 = ","+last3;
  const formatted = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ",") + last3;
  return (neg?"-":"") + "₹" + formatted + "." + dec;
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){ if(!d) return "-"; const dt=new Date(d+"T00:00:00"); return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function escapeHtml(s){ return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function uuidShort(){ return Math.random().toString(36).slice(2,8).toUpperCase(); }

function numberToWordsIndian(num){
  num = Math.round(num);
  if(num===0) return "Zero";
  const ones=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  const tens=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  function two(n){ if(n<20) return ones[n]; return tens[Math.floor(n/10)]+(n%10?" "+ones[n%10]:""); }
  function three(n){ if(n>99) return ones[Math.floor(n/100)]+" Hundred"+(n%100?" "+two(n%100):""); return two(n); }
  let parts=[];
  let crore=Math.floor(num/10000000); num%=10000000;
  let lakh=Math.floor(num/100000); num%=100000;
  let thousand=Math.floor(num/1000); num%=1000;
  let rest=num;
  if(crore) parts.push(three(crore)+" Crore");
  if(lakh) parts.push(three(lakh)+" Lakh");
  if(thousand) parts.push(three(thousand)+" Thousand");
  if(rest) parts.push(three(rest));
  return parts.join(" ");
}
function amountInWords(n){
  const rupees=Math.floor(n);
  const paise=Math.round((n-rupees)*100);
  let s="Rupees "+numberToWordsIndian(rupees);
  if(paise>0) s+=" and "+numberToWordsIndian(paise)+" Paise";
  return s+" Only";
}

function calcTotals(order){
  const subtotal = order.items.reduce((s,it)=>s+it.rate*it.qty,0)+ (order.extraCharges||0);
  const taxable = subtotal - (order.discount||0);
  const cust=state.customers.find(c=>c.id===order.customerId);
  const custState = cust ? cust.state : order.customerState;
  const sameState = custState ? custState===BUSINESS.state : true;
  let cgst=0,sgst=0,igst=0;
  order.items.forEach(it=>{
    const itemTaxable = (it.rate*it.qty) * (taxable/subtotal||1);
    const gstAmt = itemTaxable*it.gst/100;
    if(sameState){ cgst+=gstAmt/2; sgst+=gstAmt/2; } else { igst+=gstAmt; }
  });
  const rawTotal = taxable+cgst+sgst+igst;
  const grandTotal = Math.round(rawTotal);
  const roundOff = +(grandTotal-rawTotal).toFixed(2);
  return {subtotal,taxable,cgst:+cgst.toFixed(2),sgst:+sgst.toFixed(2),igst:+igst.toFixed(2),roundOff,grandTotal,sameState};
}
function recalcInvoiceStatus(inv){
  const paid = state.payments.filter(p=>p.invoiceId===inv.id).reduce((s,p)=>s+p.amount,0);
  inv.balance = +(inv.grandTotal-paid).toFixed(2);
  if(inv.balance<=0) inv.status="Paid";
  else if(paid>0) inv.status="Partially Paid";
  else inv.status = inv.status==="Cancelled"?"Cancelled":"Pending";
}

      <div class="chart-box"><canvas id="chartMonthly"></canvas></div>
    </div>

      <div class="panel-head"><div class="panel-title">Paid <span class="n">vs</span> Pending</div></div>
      <div class="chart-box"><canvas id="chartPaidPending"></canvas></div>
    </div>
  </div>
  <div class="charts-grid">
    <div class="panel">
      <div class="panel-head"><div class="panel-title">Orders by <span class="n">Event Type</span></div></div>
      <div class="chart-box"><canvas id="chartEventType"></canvas></div>
    </div>
    <div class="panel">
      <div class="panel-head"><div class="panel-title">Upcoming <span class="n">Events</span></div></div>
      <div id="upcomingList" style="max-height:230px;overflow-y:auto;"></div>

    <div class="panel-head">

    </div>
    <div id="dashNotifPanel"></div>

  document.getElementById('dashNotifPanel').innerHTML = renderDashboardNotifRows();

        <div class="muted" style="font-size:11.5px;">${o.eventType} &middot; ${o.guests} guests &middot; ${fmtDate(o.eventDate)}</div>

  },{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{ticks:{stepSize:1}}}});
}
function mkChart(id,type,data,options){
  const ctx=document.getElementById(id);
  if(!ctx) return;
  if(chartRefs[id]) chartRefs[id].destroy();
  chartRefs[id]=new Chart(ctx,{type,data,options:Object.assign({responsive:true,maintainAspectRatio:false},options)});
}

function saveCustomer(id){
  const form=document.getElementById('custForm');
  const fd=new FormData(form);
  const data=Object.fromEntries(fd.entries());
  if(!data.name.trim() || !data.mobile.trim()){ toast('Name and mobile number are required','error'); return; }
  if(id){
    const cu=state.customers.find(c=>c.id===id);
    Object.assign(cu,data);
    toast('Customer updated');
  } else {
    state.customers.push({id:uid('customer'),...data,createdAt:todayISO()});
    toast('Customer added');
  }
  closeModal(); renderCustomers();
}
function deleteCustomer(id){
  const inUse = state.orders.some(o=>o.customerId===id);
  confirmAction(inUse?'This customer has linked orders/invoices. Delete anyway? Historical records will keep the customer name.':'Delete this customer? This cannot be undone.', ()=>{
    const cu=state.customers.find(c=>c.id===id);
    // Snapshot customer details onto linked orders/invoices, then null the FK so deleted
    // customers can never break order/invoice rendering (customerName/state kept for history).
    state.orders.forEach(o=>{ if(o.customerId===id){ o.customerName=o.customerName||cu?.name; o.customerMobile=o.customerMobile||cu?.mobile; o.customerState=o.customerState||cu?.state; o.customerId=null; } });
    state.invoices.forEach(inv=>{ if(inv.customerId===id){ inv.customerName=inv.customerName||cu?.name; inv.customerGSTIN=inv.customerGSTIN||cu?.gstin; inv.customerState=inv.customerState||cu?.state; inv.customerId=null; } });
    state.customers = state.customers.filter(c=>c.id!==id);
    toast('Customer deleted'); renderCustomers();
  });
}
function viewCustomerHistory(id){
  const cu=state.customers.find(c=>c.id===id);

  openModal(`

function statusBadge(s){

function toTimeVal(t){
  // "7:00 PM" -> "19:00"
  const m=t.match(/(\d+):(\d+)\s*(AM|PM)/i);
  if(!m) return '';
  let h=parseInt(m[1])%12; if(/pm/i.test(m[3])) h+=12;
  return String(h).padStart(2,'0')+':'+m[2];
}
function fromTimeVal(v){
  if(!v) return '';
  let [h,m]=v.split(':').map(Number);
  const ap=h>=12?'PM':'AM'; let h12=h%12; if(h12===0)h12=12;
  return h12+':'+String(m).padStart(2,'0')+' '+ap;
}

function renderOrderItemRows(){

function orderItemChange(idx,menuItemId){
  const m=state.menuItems.find(x=>x.id==menuItemId);
  orderItemDraft[idx]={...orderItemDraft[idx],menuItemId:m.id,name:m.name,unit:m.unit,rate:m.rate,gst:m.gst};
  renderOrderItemRows(); updateOrderLiveTotals();
}
function orderItemQty(idx,qty){ orderItemDraft[idx].qty=parseFloat(qty)||0; renderOrderItemRows(); updateOrderLiveTotals(); }
function removeOrderItem(idx){ orderItemDraft.splice(idx,1); renderOrderItemRows(); updateOrderLiveTotals(); }
function updateOrderLiveTotals(){
  const extra=parseFloat(document.getElementById('orderExtra')?.value)||0;
  const discount=parseFloat(document.getElementById('orderDiscount')?.value)||0;
  const advance=parseFloat(document.getElementById('orderAdvance')?.value)||0;
  const custId=parseInt(document.getElementById('orderCustSelect')?.value);
  const cust=state.customers.find(c=>c.id===custId);
  const sameState = cust ? cust.state===BUSINESS.state : true;
  const subtotal=orderItemDraft.reduce((s,it)=>s+it.rate*it.qty,0)+extra;
  const taxable=Math.max(subtotal-discount,0);
  let gstTotal=0;
  orderItemDraft.forEach(it=>{ const itemTaxable=(it.rate*it.qty)*(subtotal? taxable/subtotal:1); gstTotal+=itemTaxable*it.gst/100; });
  const grand=Math.round(taxable+gstTotal);
  const balance=grand-advance;
  const box=document.getElementById('orderLiveTotals');
  if(!box) return;
  box.innerHTML=`
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;font-size:12.5px;">
      <div><div class="muted">Subtotal</div><b>${rupee(subtotal)}</b></div>
      <div><div class="muted">Taxable Amount</div><b>${rupee(taxable)}</b></div>
      <div><div class="muted">GST (${sameState?'CGST+SGST':'IGST'})</div><b>${rupee(gstTotal)}</b></div>
      <div><div class="muted">Grand Total</div><b style="color:var(--primary)">${rupee(grand)}</b></div>
      <div><div class="muted">Advance</div><b>${rupee(advance)}</b></div>
      <div><div class="muted">Balance Due</div><b style="color:var(--danger)">${rupee(balance)}</b></div>
      <div><div class="muted">Per-Plate Rate</div><b>${rupee((subtotal)/(parseFloat(document.getElementById('orderGuests')?.value)||1))}</b></div>
    </div>`;
}
function saveOrder(id){
  const fd=new FormData(document.getElementById('orderForm'));
  const d=Object.fromEntries(fd.entries());
  if(!d.eventName.trim()||!d.venue.trim()||!d.eventDate){ toast('Event name, date and venue are required','error'); return; }
  if(!orderItemDraft.length){ toast('Add at least one menu item to the order','error'); return; }
  d.customerId=parseInt(d.customerId); d.guests=parseInt(d.guests)||1;
  d.extraCharges=parseFloat(d.extraCharges)||0; d.discount=parseFloat(d.discount)||0; d.advance=parseFloat(d.advance)||0;
  d.eventTime=fromTimeVal(d.eventTime);
  const cust=state.customers.find(c=>c.id===d.customerId);
  const perPlate=orderItemDraft.reduce((s,it)=>s+it.rate*it.qty,0)/(d.guests||1);
  if(id){
    const o=state.orders.find(x=>x.id===id);
    Object.assign(o,d,{items:orderItemDraft,customerName:cust.name,customerMobile:cust.mobile,customerState:cust.state,perPlateRate:Math.round(perPlate)});
    toast('Order updated');

    state.orders.push({id:uid('order'),orderNo:'ORD-'+state.invoiceYear+'-'+String(state.orderCounter++).padStart(4,'0'),...d,items:orderItemDraft,customerName:cust.name,customerMobile:cust.mobile,customerState:cust.state,perPlateRate:Math.round(perPlate)});
    orderSearch=''; orderStatusFilter='';
    toast('Catering order saved successfully');
  }
  closeModal(); renderOrders();
}

let invSearch='', invStatusFilter='';
function nextInvoiceNo(){ return "INV-"+state.invoiceYear+"-"+String(state.invoiceCounter).padStart(4,'0'); }

function createInvoiceFromOrder(orderId){
  const order=state.orders.find(o=>o.id===orderId);
  if(state.invoices.some(i=>i.orderId===orderId)){ toast('An invoice already exists for this order — duplicating instead','error'); }
  const t=calcTotals(order);
  const cust=state.customers.find(c=>c.id===order.customerId);
  const id=uid('invoice');
  const invoiceNo=nextInvoiceNo(); state.invoiceCounter++;
  const balance=t.grandTotal-(order.advance||0);
  state.invoices.push({
    id, invoiceNo, invoiceDate:todayISO(), orderId:order.id, customerId:order.customerId,
    customerName:cust?cust.name:order.customerName, customerGSTIN:cust?cust.gstin:'', customerState:cust?cust.state:order.customerState,
    eventName:order.eventName, eventDate:order.eventDate, venue:order.venue,
    items:order.items.map(it=>({description:it.name,qty:it.qty,unit:it.unit,rate:it.rate,gst:it.gst})),
    extraCharges:order.extraCharges, discount:order.discount,
    subtotal:t.subtotal, taxable:t.taxable, cgst:t.cgst, sgst:t.sgst, igst:t.igst, roundOff:t.roundOff,
    grandTotal:t.grandTotal, advance:order.advance||0, balance, sameState:t.sameState, status: balance<=0?'Paid':(order.advance>0?'Partially Paid':'Pending')
  });
  toast('Invoice '+invoiceNo+' created');
  goTo('invoices');
  setTimeout(()=>viewInvoice(id),80);
}

  saveData();
  const c=document.querySelector('.page');

  const inv=state.invoices.find(i=>i.id===id);
  inv.invoiceDate=document.getElementById('editInvDate').value;
  inv.extraCharges=parseFloat(document.getElementById('editInvExtra').value)||0;
  inv.discount=parseFloat(document.getElementById('editInvDiscount').value)||0;
  inv.advance=parseFloat(document.getElementById('editInvAdvance').value)||0;
  const itemSubtotal=inv.items.reduce((s,it)=>s+it.rate*it.qty,0);
  const subtotal=itemSubtotal+inv.extraCharges;
  const taxable=Math.max(subtotal-inv.discount,0);
  let cgst=0,sgst=0,igst=0;
  inv.items.forEach(it=>{
    const itemTaxable=(it.rate*it.qty)*(subtotal? taxable/subtotal:1);
    const g=itemTaxable*it.gst/100;
    if(inv.sameState){cgst+=g/2;sgst+=g/2;} else {igst+=g;}
  });
  const raw=taxable+cgst+sgst+igst;
  const grand=Math.round(raw);
  inv.subtotal=subtotal; inv.taxable=taxable; inv.cgst=+cgst.toFixed(2); inv.sgst=+sgst.toFixed(2); inv.igst=+igst.toFixed(2);
  inv.roundOff=+(grand-raw).toFixed(2); inv.grandTotal=grand;
  recalcInvoiceStatus(inv);
  toast('Invoice updated'); closeModal(); renderInvoices();
}

function downloadInvoicePDF(id){
  const inv=state.invoices.find(i=>i.id===id);
  const src=document.getElementById('invoiceDoc');
  if(!src){ toast('Open the invoice first','error'); return; }
  toast('Preparing PDF…');
  html2canvas(src,{scale:2,backgroundColor:'#ffffff'}).then(canvas=>{
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p','pt','a4');
    const pageWidth=pdf.internal.pageSize.getWidth();
    const imgWidth=pageWidth-40;
    const imgHeight=canvas.height*imgWidth/canvas.width;
    pdf.addImage(canvas.toDataURL('image/png'),'PNG',20,20,imgWidth,imgHeight);
    pdf.save(inv.invoiceNo+'.pdf');
    toast('Invoice downloaded');
  }).catch(()=>toast('Could not generate PDF — try Print instead','error'));

function openRecordPayment(invoiceId){
  const unpaid=state.invoices.filter(i=>i.status!=='Cancelled' && i.balance>0);
  if(!unpaid.length && !invoiceId){ toast('No outstanding invoices to pay against','error'); return; }
  openModal(`

    <div class="modal-body">
      <form id="payForm">
        <div class="form-grid">
          <div class="field full"><label>Invoice <span class="req">*</span></label>
            <select required name="invoiceId" id="payInvoiceSelect" onchange="updatePayInvoiceInfo()">
              ${(invoiceId? state.invoices.filter(i=>i.id===invoiceId) : unpaid).map(i=>`<option value="${i.id}" ${invoiceId===i.id?'selected':''}>${i.invoiceNo} — ${escapeHtml(i.customerName)} (Balance ${rupee(i.balance)})</option>`).join('')}

          <div class="field"><label>Amount (₹) <span class="req">*</span></label><input required type="number" min="0.01" step="0.01" name="amount" id="payAmountInput" oninput="this.dataset.touched='1'"></div>
          <div class="field"><label>Reference Number</label><input name="reference" placeholder="UTR / Cheque no."></div>
          <div class="field full"><label>Remarks</label><textarea name="remarks"></textarea></div>
        </div>
        <p class="hint" id="payBalanceHint" style="margin-top:8px;"></p>
      </form>
    </div>
    <div class="modal-foot"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="savePayment()">Record Payment</button></div>
  `);
  updatePayInvoiceInfo();
}
function updatePayInvoiceInfo(){
  const sel=document.getElementById('payInvoiceSelect'); if(!sel) return;
  const inv=state.invoices.find(i=>i.id===parseInt(sel.value));
  document.getElementById('payBalanceHint').textContent = inv? `Outstanding balance: ${rupee(inv.balance)}` : '';
  const amtInput=document.getElementById('payAmountInput');
  if(inv && amtInput.dataset.touched!=='1') amtInput.value=inv.balance;
}
function savePayment(){
  const fd=new FormData(document.getElementById('payForm'));
  const d=Object.fromEntries(fd.entries());
  d.invoiceId=parseInt(d.invoiceId); d.amount=parseFloat(d.amount);
  if(!d.amount || d.amount<=0){ toast('Enter a valid payment amount','error'); return; }
  const inv=state.invoices.find(i=>i.id===d.invoiceId);
  if(d.amount>inv.balance+0.01){ toast('Amount exceeds outstanding balance ('+rupee(inv.balance)+')','error'); return; }
  state.payments.push({id:uid('payment'),customerId:inv.customerId,...d});
  recalcInvoiceStatus(inv);
  toast('Payment of '+rupee(d.amount)+' recorded');
  closeModal(); render();
}
function deletePayment(id){
  confirmAction('Delete this payment record? The invoice balance will be recalculated.', ()=>{
    const p=state.payments.find(x=>x.id===id);
    state.payments=state.payments.filter(x=>x.id!==id);
    const inv=state.invoices.find(i=>i.id===p.invoiceId);
    if(inv) recalcInvoiceStatus(inv);
    toast('Payment deleted'); render();
  });
}

function openInventoryForm(id){

function saveInventoryItem(id){
  const fd=new FormData(document.getElementById('invyForm'));
  const d=Object.fromEntries(fd.entries());
  if(!d.name.trim()){ toast('Item name is required','error'); return; }
  ['opening','purchase','consumption','wastage','minLevel'].forEach(k=>d[k]=parseFloat(d[k])||0);
  d.closing = d.opening+d.purchase-d.consumption-d.wastage;
  if(id){ Object.assign(state.inventory.find(i=>i.id===id),d); toast('Inventory updated'); }
  else { state.inventory.push({id:uid('inventory'),...d}); toast('Inventory item added'); }
  closeModal(); renderInventory();
}
function deleteInventoryItem(id){

}

const REPORT_TYPES=[
  ["sales","Sales Report"],["invoices","Invoice Report"],["customers","Customer Report"],
  ["outstanding","Outstanding Report"],["payments","Payment Report"],["gst","GST Report"],
  ["eventwise","Event-wise Sales"],["monthly","Monthly Sales"],["fooditem","Food Item Sales"],["profit","Profit / Cost Report"]
];
let activeReport='sales';
let reportRange={from:null,to:null,quick:'all'};
function renderReports(){
  const c=document.querySelector('.page');
  c.innerHTML=`
  <div class="section-head">
    <div><h2>Reports</h2><div class="desc">Business performance across sales, GST, and cost data</div></div>

      <button class="btn btn-outline" onclick="printReport()">${svgIcon('print')}Print</button>

    </div>
  </div>
  <div class="report-tabs" id="reportTabs">

  </div>
  <div class="toolbar">
    <div class="date-filter" id="dateFilterBar">
      ${['Today','This Week','This Month','This Year','All Time'].map(q=>`<button class="quick ${reportRange.quick===q?'active':''}" onclick="setQuickRange('${q}')">${q}</button>`).join('')}

function setReport(k){ activeReport=k; renderReports(); }
function setQuickRange(q){
  reportRange.quick=q;
  const today=new Date();
  const iso=d=>d.toISOString().slice(0,10);
  if(q==='Today'){ reportRange.from=iso(today); reportRange.to=iso(today); }
  else if(q==='This Week'){ const d=new Date(today); d.setDate(d.getDate()-d.getDay()); reportRange.from=iso(d); reportRange.to=iso(today); }
  else if(q==='This Month'){ reportRange.from=iso(new Date(today.getFullYear(),today.getMonth(),1)); reportRange.to=iso(today); }
  else if(q==='This Year'){ reportRange.from=iso(new Date(today.getFullYear(),0,1)); reportRange.to=iso(today); }
  else { reportRange.from=null; reportRange.to=null; }
  renderReports();
}
function applyCustomRange(){
  reportRange.quick='Custom';
  reportRange.from=document.getElementById('rangeFrom').value||null;
  reportRange.to=document.getElementById('rangeTo').value||null;
  renderReportBody();
  document.querySelectorAll('#dateFilterBar .quick').forEach(b=>b.classList.remove('active'));
}
function inRange(dateStr){
  if(!reportRange.from && !reportRange.to) return true;
  if(reportRange.from && dateStr<reportRange.from) return false;
  if(reportRange.to && dateStr>reportRange.to) return false;
  return true;
}
function renderReportBody(){
  const body=document.getElementById('reportBody');
  const summary=document.getElementById('reportSummary');
  let rows=[], head=[], exportRows=[], summaryChips=[];

  if(activeReport==='sales'){
    const list=state.invoices.filter(i=>inRange(i.invoiceDate)&&i.status!=='Cancelled');

    head=['Invoice','Date','Customer','Event','Grand Total','Status'];
    rows=list.map(i=>[i.invoiceNo,fmtDate(i.invoiceDate),i.customerName,i.eventName,rupee(i.grandTotal),statusBadge(i.status)]);
    exportRows=list.map(i=>({Invoice:i.invoiceNo,Date:i.invoiceDate,Customer:i.customerName,Event:i.eventName,GrandTotal:i.grandTotal,Status:i.status}));
  }
  else if(activeReport==='invoices'){
    const list=state.invoices.filter(i=>inRange(i.invoiceDate));
    summaryChips=[['Total',list.length],['Paid',list.filter(i=>i.status==='Paid').length],['Pending',list.filter(i=>i.status==='Pending'||i.status==='Partially Paid').length],['Cancelled',list.filter(i=>i.status==='Cancelled').length]];
    head=['Invoice','Date','Customer','Grand Total','Balance','Status'];
    rows=list.map(i=>[i.invoiceNo,fmtDate(i.invoiceDate),i.customerName,rupee(i.grandTotal),rupee(i.balance),statusBadge(i.status)]);
    exportRows=list.map(i=>({Invoice:i.invoiceNo,Date:i.invoiceDate,Customer:i.customerName,GrandTotal:i.grandTotal,Balance:i.balance,Status:i.status}));
  }
  else if(activeReport==='customers'){
    const list=state.customers.map(cu=>{
      const invs=state.invoices.filter(i=>i.customerId===cu.id && inRange(i.invoiceDate));
      const total=invs.reduce((s,i)=>s+i.grandTotal,0);
      const out=invs.reduce((s,i)=>s+Math.max(i.balance,0),0);
      return {cu,invs,total,out};
    }).filter(r=>r.invs.length);
    summaryChips=[['Active Customers',list.length],['Total Billed',rupee(list.reduce((s,r)=>s+r.total,0))]];
    head=['Customer','Mobile','Invoices','Total Billed','Outstanding'];
    rows=list.map(r=>[r.cu.name,r.cu.mobile,r.invs.length,rupee(r.total),rupee(r.out)]);
    exportRows=list.map(r=>({Customer:r.cu.name,Mobile:r.cu.mobile,Invoices:r.invs.length,TotalBilled:r.total,Outstanding:r.out}));
  }
  else if(activeReport==='outstanding'){
    const list=state.invoices.filter(i=>i.balance>0 && i.status!=='Cancelled');
    const total=list.reduce((s,i)=>s+i.balance,0);
    summaryChips=[['Open Invoices',list.length],['Total Outstanding',rupee(total)]];
    head=['Invoice','Customer','Invoice Date','Grand Total','Balance','Status'];
    rows=list.map(i=>[i.invoiceNo,i.customerName,fmtDate(i.invoiceDate),rupee(i.grandTotal),rupee(i.balance),statusBadge(i.status)]);
    exportRows=list.map(i=>({Invoice:i.invoiceNo,Customer:i.customerName,InvoiceDate:i.invoiceDate,GrandTotal:i.grandTotal,Balance:i.balance,Status:i.status}));
  }
  else if(activeReport==='payments'){
    const list=state.payments.filter(p=>inRange(p.date));
    const total=list.reduce((s,p)=>s+p.amount,0);
    summaryChips=[['Payments',list.length],['Total Collected',rupee(total)]];
    head=['Payment ID','Invoice','Date','Mode','Amount','Reference'];
    rows=list.map(p=>{const inv=state.invoices.find(i=>i.id===p.invoiceId); return ['PAY-'+String(p.id).padStart(4,'0'),inv?inv.invoiceNo:'-',fmtDate(p.date),p.mode,rupee(p.amount),p.reference||'-'];});
    exportRows=list.map(p=>{const inv=state.invoices.find(i=>i.id===p.invoiceId); return {PaymentId:'PAY-'+String(p.id).padStart(4,'0'),Invoice:inv?inv.invoiceNo:'-',Date:p.date,Mode:p.mode,Amount:p.amount,Reference:p.reference};});
  }
  else if(activeReport==='gst'){
    const list=state.invoices.filter(i=>inRange(i.invoiceDate)&&i.status!=='Cancelled');
    const totCgst=list.reduce((s,i)=>s+i.cgst,0), totSgst=list.reduce((s,i)=>s+i.sgst,0), totIgst=list.reduce((s,i)=>s+i.igst,0);
    summaryChips=[['CGST',rupee(totCgst)],['SGST',rupee(totSgst)],['IGST',rupee(totIgst)],['Total GST',rupee(totCgst+totSgst+totIgst)]];
    head=['Invoice','Date','Customer','Taxable','CGST','SGST','IGST','Total'];
    rows=list.map(i=>[i.invoiceNo,fmtDate(i.invoiceDate),i.customerName,rupee(i.taxable),rupee(i.cgst),rupee(i.sgst),rupee(i.igst),rupee(i.cgst+i.sgst+i.igst)]);
    exportRows=list.map(i=>({Invoice:i.invoiceNo,Date:i.invoiceDate,Customer:i.customerName,Taxable:i.taxable,CGST:i.cgst,SGST:i.sgst,IGST:i.igst}));
  }
  else if(activeReport==='eventwise'){
    const map={};
    state.orders.filter(o=>inRange(o.orderDate)).forEach(o=>{
      const t=calcTotals(o);
      map[o.eventType]=map[o.eventType]||{count:0,total:0,guests:0};
      map[o.eventType].count++; map[o.eventType].total+=t.grandTotal; map[o.eventType].guests+=o.guests;
    });
    const list=Object.entries(map);
    summaryChips=[['Event Types',list.length],['Total Value',rupee(list.reduce((s,[,v])=>s+v.total,0))]];
    head=['Event Type','Orders','Total Guests','Total Value'];
    rows=list.map(([k,v])=>[k,v.count,v.guests,rupee(v.total)]);
    exportRows=list.map(([k,v])=>({EventType:k,Orders:v.count,Guests:v.guests,TotalValue:v.total}));
  }
  else if(activeReport==='monthly'){
    const map={};
    state.invoices.filter(i=>i.status!=='Cancelled').forEach(i=>{
      const d=new Date(i.invoiceDate); const key=d.toLocaleDateString('en-IN',{month:'short',year:'numeric'});
      map[key]=(map[key]||0)+i.grandTotal;
    });
    const list=Object.entries(map);
    summaryChips=[['Months',list.length],['Grand Total',rupee(list.reduce((s,[,v])=>s+v,0))]];
    head=['Month','Total Sales'];
    rows=list.map(([k,v])=>[k,rupee(v)]);
    exportRows=list.map(([k,v])=>({Month:k,TotalSales:v}));
  }
  else if(activeReport==='fooditem'){
    const map={};
    state.orders.filter(o=>inRange(o.orderDate)).forEach(o=>o.items.forEach(it=>{
      map[it.name]=map[it.name]||{qty:0,revenue:0,unit:it.unit};
      map[it.name].qty+=it.qty; map[it.name].revenue+=it.qty*it.rate;
    }));
    const list=Object.entries(map).sort((a,b)=>b[1].revenue-a[1].revenue);
    summaryChips=[['Items Sold',list.length],['Total Revenue',rupee(list.reduce((s,[,v])=>s+v.revenue,0))]];
    head=['Food Item','Qty Sold','Unit','Revenue'];
    rows=list.map(([k,v])=>[k,v.qty,v.unit,rupee(v.revenue)]);
    exportRows=list.map(([k,v])=>({Item:k,QtySold:v.qty,Unit:v.unit,Revenue:v.revenue}));
  }
  else if(activeReport==='profit'){
    const map={};
    state.invoices.filter(i=>i.status!=='Cancelled').forEach(i=>{ const d=new Date(i.invoiceDate); const key=d.toLocaleDateString('en-IN',{month:'short',year:'numeric'}); map[key]=map[key]||{sales:0,expense:0}; map[key].sales+=i.grandTotal; });
    state.expenses.forEach(e=>{ const d=new Date(e.date); const key=d.toLocaleDateString('en-IN',{month:'short',year:'numeric'}); map[key]=map[key]||{sales:0,expense:0}; map[key].expense+=e.amount; });
    const list=Object.entries(map);
    const totSales=list.reduce((s,[,v])=>s+v.sales,0), totExp=list.reduce((s,[,v])=>s+v.expense,0);
    summaryChips=[['Total Sales',rupee(totSales)],['Total Expenses',rupee(totExp)],['Gross Profit',rupee(totSales-totExp)]];
    head=['Month','Sales','Expenses','Gross Profit'];
    rows=list.map(([k,v])=>[k,rupee(v.sales),rupee(v.expense),rupee(v.sales-v.expense)]);
    exportRows=list.map(([k,v])=>({Month:k,Sales:v.sales,Expenses:v.expense,GrossProfit:v.sales-v.expense}));
  }

  summary.innerHTML = `<div class="summary-strip">${summaryChips.map(([l,v])=>`<div class="summary-chip"><div class="l">${l}</div><div class="v">${v}</div></div>`).join('')}</div>`;
  if(!rows.length){ body.innerHTML=emptyState('reports','No data for this period','Try widening the date range or a different report.'); }
  else {
    body.innerHTML=`<table><thead><tr>${head.map((h,idx)=>`<th class="${typeof rows[0][idx]==='number'?'num':''}">${h}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(r=>`<tr>${r.map((v,idx)=>`<td class="${typeof v==='number'?'num':''}">${v}</td>`).join('')}</tr>`).join('')}
    </tbody></table>`;
  }
  document.getElementById('reportExportBtn').onclick=()=>exportCSV(exportRows,activeReport+'-report.csv');
}
function printReport(){
  const title=REPORT_TYPES.find(r=>r[0]===activeReport)[1];
  let area=document.getElementById('printArea'); if(area) area.remove();
  area=document.createElement('div'); area.id='printArea';
  area.innerHTML=`<div style="padding:20px;"><h2 style="font-family:Fraunces,serif;">${title} — ${BUSINESS.name}</h2>${document.getElementById('reportSummary').innerHTML}${document.getElementById('reportBody').innerHTML}</div>`;
  document.body.appendChild(area);
  window.print();
  setTimeout(()=>area.remove(),500);
}
function exportCSV(rows,filename){
  if(!rows||!rows.length){ toast('Nothing to export','error'); return; }
  const headers=Object.keys(rows[0]);
  const csv=[headers.join(',')].concat(rows.map(r=>headers.map(h=>{
    let v=r[h]; if(typeof v==='string' && (v.includes(',')||v.includes('"'))) v='"'+v.replace(/"/g,'""')+'"';
    return v;
  }).join(','))).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; a.click();
  toast('Exported '+filename);
}

/* ============================================================
   DATA MANAGEMENT — localStorage autosave, Excel backup/restore,
   JSON backup/restore, Clear Data, Reset Demo Data.
   All processing happens locally in the browser. No server,
   no external upload, no eval(), no execution of Excel formulas.
   ============================================================ */

function saveData(){
  try{
    const payload={
      customers:state.customers, menuItems:state.menuItems, orders:state.orders, invoices:state.invoices,
      payments:state.payments, expenses:state.expenses, suppliers:state.suppliers, inventory:state.inventory,
      seq:state.seq, invoiceYear:state.invoiceYear, invoiceCounter:state.invoiceCounter, orderCounter:state.orderCounter
    };
    localStorage.setItem(LS_KEY, JSON.stringify(payload));
  }catch(err){ console.error('Auto-save to localStorage failed', err); }
  scheduleLiveSync();
  scheduleSupabaseSync();
  refreshNotifBadge();
}
function loadData(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(!raw) return false;
    const d=JSON.parse(raw);
    if(!d || !Array.isArray(d.customers)) return false;
    state.customers=d.customers||[]; state.menuItems=d.menuItems||[]; state.orders=d.orders||[];
    state.invoices=d.invoices||[]; state.payments=d.payments||[]; state.expenses=d.expenses||[];
    state.suppliers=d.suppliers||[]; state.inventory=d.inventory||[];
    state.seq=d.seq||state.seq; state.invoiceYear=d.invoiceYear||state.invoiceYear;
    state.invoiceCounter=d.invoiceCounter||state.invoiceCounter; state.orderCounter=d.orderCounter||state.orderCounter;
    return true;
  }catch(err){ console.error('Loading saved data failed, will use seed data instead', err); return false; }
}
function recalcInventoryClosing(item){ item.closing = (item.opening||0)+(item.purchase||0)-(item.consumption||0)-(item.wastage||0); }
function recalcAllDerived(){
  state.invoices.forEach(inv=>{ if(window.recalcInvoiceStatus) window.recalcInvoiceStatus(inv); });
  state.inventory.forEach(recalcInventoryClosing);
}
function pad2(n){ return String(n).padStart(2,'0'); }
function toDMY(iso){ if(!iso) return ''; const m=String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/); return m?`${m[3]}-${m[2]}-${m[1]}`:String(iso); }
function fromDMY(s){ if(!s) return ''; const str=String(s).trim(); let m=str.match(/^(\d{2})-(\d{2})-(\d{4})$/); if(m) return `${m[3]}-${m[2]}-${m[1]}`; m=str.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return `${m[1]}-${m[2]}-${m[3]}`; return str; }
function idNum(v){ if(v==null) return null; const m=String(v).match(/(\d+)\s*$/); return m?parseInt(m[1]):(parseInt(v)||null); }
function yesNo(v){ return v===true||v===true+''||/^(yes|true|1|active)$/i.test(String(v).trim()); }

/* ---------- Row builders for each Excel sheet ---------- */
function rowsCustomers(){ return state.customers.map(c=>({'Customer ID':'CUS-'+String(c.id).padStart(3,'0'),'Customer Name':c.name,'Mobile':c.mobile,'Email':c.email,'Address':c.address,'GSTIN':c.gstin,'Company':c.company,'Billing Address':c.billingAddress,'Event Address':c.eventAddress,'Notes':c.notes,'State':c.state,'Created Date':toDMY(c.createdAt)})); }

function rowsOrders(){ return state.orders.map(o=>({'Order ID':'ORD-ID-'+o.id,'Order Number':o.orderNo,'Order Date':toDMY(o.orderDate),'Customer ID':'CUS-'+String(o.customerId).padStart(3,'0'),'Customer Name':o.customerName,'Customer Mobile':o.customerMobile,'Event Name':o.eventName,'Event Type':o.eventType,'Event Date':toDMY(o.eventDate),'Event Time':o.eventTime,'Venue':o.venue,'Guests':o.guests,'Per Plate Rate':o.perPlateRate,'Extra Charges':o.extraCharges,'Discount':o.discount,'Advance':o.advance,'Status':o.status,'Special Instructions':o.specialInstructions})); }

function rowsInvoices(){ return state.invoices.map(i=>({'Invoice ID':'INV-ID-'+i.id,'Invoice Number':i.invoiceNo,'Invoice Date':toDMY(i.invoiceDate),'Order ID':i.orderId?('ORD-ID-'+i.orderId):'','Customer ID':'CUS-'+String(i.customerId).padStart(3,'0'),'Customer Name':i.customerName,'Customer GSTIN':i.customerGSTIN||'','Customer State':i.customerState,'Event Name':i.eventName,'Event Date':toDMY(i.eventDate),'Venue':i.venue,'Subtotal':i.subtotal,'Taxable Amount':i.taxable,'CGST':i.cgst,'SGST':i.sgst,'IGST':i.igst,'Round Off':i.roundOff,'Grand Total':i.grandTotal,'Advance':i.advance,'Balance':i.balance,'Status':i.status,'Same State':i.sameState?'Yes':'No'})); }
function rowsInvoiceItems(){ const r=[]; state.invoices.forEach(i=>(i.items||[]).forEach(it=>r.push({'Invoice ID':'INV-ID-'+i.id,'Invoice Number':i.invoiceNo,'Description':it.description,'Quantity':it.qty,'Unit':it.unit,'Rate':it.rate,'GST Rate':it.gst,'Amount':+(it.rate*it.qty).toFixed(2)}))); return r; }
function rowsPayments(){ return state.payments.map(p=>{ const inv=state.invoices.find(i=>i.id===p.invoiceId); return {'Payment ID':'PAY-'+String(p.id).padStart(4,'0'),'Invoice ID':inv?('INV-ID-'+inv.id):'','Invoice Number':inv?inv.invoiceNo:'','Customer ID':'CUS-'+String(p.customerId).padStart(3,'0'),'Customer Name':inv?inv.customerName:'','Date':toDMY(p.date),'Payment Mode':p.mode,'Amount':p.amount,'Reference':p.reference,'Remarks':p.remarks}; }); }

function rowsGSTReport(){ return state.invoices.filter(i=>i.status!=='Cancelled').map(i=>({'Invoice Number':i.invoiceNo,'Invoice Date':toDMY(i.invoiceDate),'Customer':i.customerName,'GSTIN':i.customerGSTIN||'Unregistered','Taxable Amount':i.taxable,'CGST':i.cgst,'SGST':i.sgst,'IGST':i.igst,'Total GST':+(i.cgst+i.sgst+i.igst).toFixed(2),'Grand Total':i.grandTotal})); }
function rowsSalesReport(){ return state.invoices.map(i=>({'Invoice Number':i.invoiceNo,'Date':toDMY(i.invoiceDate),'Customer':i.customerName,'Event':i.eventName,'Taxable Amount':i.taxable,'GST':+(i.cgst+i.sgst+i.igst).toFixed(2),'Grand Total':i.grandTotal,'Paid':+(i.grandTotal-i.balance).toFixed(2),'Outstanding':i.balance,'Status':i.status})); }
function rowsOutstandingReport(){ return state.invoices.filter(i=>i.balance>0 && i.status!=='Cancelled').map(i=>({'Invoice Number':i.invoiceNo,'Customer':i.customerName,'Invoice Date':toDMY(i.invoiceDate),'Grand Total':i.grandTotal,'Paid Amount':+(i.grandTotal-i.balance).toFixed(2),'Outstanding':i.balance,'Status':i.status})); }
function monthlySalesMap(){
  const map={};
  state.invoices.filter(i=>i.status!=='Cancelled').forEach(i=>{ const d=new Date(i.invoiceDate); const key=d.toLocaleDateString('en-IN',{month:'short',year:'numeric'}); map[key]=map[key]||{sales:0,expense:0}; map[key].sales+=i.grandTotal; });
  state.expenses.forEach(e=>{ const d=new Date(e.date); const key=d.toLocaleDateString('en-IN',{month:'short',year:'numeric'}); map[key]=map[key]||{sales:0,expense:0}; map[key].expense+=e.amount; });
  return map;
}
function rowsMonthlySales(){ return Object.entries(monthlySalesMap()).map(([k,v])=>({'Month':k,'Sales':+v.sales.toFixed(2),'Expenses':+v.expense.toFixed(2),'Gross Profit':+(v.sales-v.expense).toFixed(2)})); }
function rowsProfitCost(){ return rowsMonthlySales(); }
function rowsFoodItemSales(){
  const map={};
  state.orders.forEach(o=>(o.items||[]).forEach(it=>{ map[it.name]=map[it.name]||{qty:0,revenue:0}; map[it.name].qty+=it.qty; map[it.name].revenue+=it.qty*it.rate; }));
  return Object.entries(map).sort((a,b)=>b[1].revenue-a[1].revenue).map(([k,v])=>({'Item Name':k,'Quantity Sold':v.qty,'Sales Amount':+v.revenue.toFixed(2)}));
}
function rowsBusinessSummary(){
  const totalSales=state.invoices.filter(i=>i.status!=='Cancelled').reduce((s,i)=>s+i.grandTotal,0);
  const totalPayments=state.payments.reduce((s,p)=>s+p.amount,0);
  const totalOutstanding=state.invoices.reduce((s,i)=>s+Math.max(i.balance,0),0);
  const totalExpenses=state.expenses.reduce((s,e)=>s+e.amount,0);
  return [
    {'Metric':'Business Name','Value':BUSINESS.name},
    {'Metric':'Backup Generated','Value':toDMY(todayISO())+' '+new Date().toLocaleTimeString('en-IN')},
    {'Metric':'Total Customers','Value':state.customers.length},
    {'Metric':'Total Catering Orders','Value':state.orders.length},
    {'Metric':'Total Invoices','Value':state.invoices.length},
    {'Metric':'Total Sales (₹)','Value':+totalSales.toFixed(2)},
    {'Metric':'Total Payments Collected (₹)','Value':+totalPayments.toFixed(2)},
    {'Metric':'Total Outstanding (₹)','Value':+totalOutstanding.toFixed(2)},
    {'Metric':'Total Expenses (₹)','Value':+totalExpenses.toFixed(2)},
    {'Metric':'Gross Profit (₹)','Value':+(totalSales-totalExpenses).toFixed(2)}
  ];
}

/* ---------- Excel workbook builder ---------- */
const CURRENCY_HEADERS = new Set(['Rate','Amount','Subtotal','Taxable Amount','CGST','SGST','IGST','Round Off','Grand Total','Advance','Balance','Outstanding','Outstanding Amount','Paid','Paid Amount','Sales','Expenses','Gross Profit','Total GST','Sales Amount','Per Plate Rate','Extra Charges','Discount','Value']);
function addXLSXSheet(wb,name,rows){
  const data = rows && rows.length ? rows : [{'Info':'No records yet'}];
  const ws = XLSX.utils.json_to_sheet(data);
  const headers = Object.keys(data[0]);
  ws['!cols'] = headers.map(h=>({wch:Math.max(12,Math.min(34,h.length+4))}));
  if(ws['!ref']){
    ws['!autofilter']={ref:ws['!ref']};
    ws['!freeze']={xSplit:0,ySplit:1,topLeftCell:'A2',activePane:'bottomLeft',state:'frozen'};
    const range=XLSX.utils.decode_range(ws['!ref']);
    for(let C=range.s.c;C<=range.e.c;C++){
      const addr=XLSX.utils.encode_cell({r:0,c:C});
      if(ws[addr]) ws[addr].s={font:{bold:true,color:{rgb:"FFFFFF"}},fill:{fgColor:{rgb:"1B4332"}},alignment:{vertical:'center'}};
      if(CURRENCY_HEADERS.has(headers[C])){
        for(let R=range.s.r+1;R<=range.e.r;R++){
          const caddr=XLSX.utils.encode_cell({r:R,c:C});
          if(ws[caddr] && typeof ws[caddr].v==='number') ws[caddr].z='"₹"#,##0.00';
        }
      }
    }
  }
  XLSX.utils.book_append_sheet(wb, ws, name.slice(0,31));
}
function buildBackupWorkbook(){
  const wb=XLSX.utils.book_new();
  addXLSXSheet(wb,'Customers',rowsCustomers());
  addXLSXSheet(wb,'Menu Items',rowsMenuItems());
  addXLSXSheet(wb,'Catering Orders',rowsOrders());
  addXLSXSheet(wb,'Order Items',rowsOrderItems());
  addXLSXSheet(wb,'Invoices',rowsInvoices());
  addXLSXSheet(wb,'Invoice Items',rowsInvoiceItems());
  addXLSXSheet(wb,'Payments',rowsPayments());
  addXLSXSheet(wb,'Expenses',rowsExpenses());
  addXLSXSheet(wb,'Suppliers',rowsSuppliers());
  addXLSXSheet(wb,'Inventory',rowsInventory());
  addXLSXSheet(wb,'GST Report',rowsGSTReport());
  addXLSXSheet(wb,'Sales Report',rowsSalesReport());
  addXLSXSheet(wb,'Outstanding Report',rowsOutstandingReport());
  addXLSXSheet(wb,'Monthly Sales',rowsMonthlySales());
  addXLSXSheet(wb,'Food Item Sales',rowsFoodItemSales());
  addXLSXSheet(wb,'Profit Cost Report',rowsProfitCost());
  addXLSXSheet(wb,'Business Summary',rowsBusinessSummary());
  return wb;
}
function exportExcelBackup(){
  try{
    const wb=buildBackupWorkbook();
    const ts=new Date();
    const fname=`Saffron_Table_Backup_${ts.getFullYear()}-${pad2(ts.getMonth()+1)}-${pad2(ts.getDate())}_${pad2(ts.getHours())}-${pad2(ts.getMinutes())}.xlsx`;
    XLSX.writeFile(wb,fname,{cellStyles:true});
    toast('Excel backup downloaded: '+fname);
  }catch(err){
    console.error(err);
    toast('Could not create the Excel backup — please try again','error');
  }
}

/* ---------- LIVE EXCEL SYNC ----------
   Uses the File System Access API (Chrome / Edge / other Chromium
   browsers only — Firefox and Safari do not support it) to keep a
   real .xlsx file on disk automatically updated every time data
   changes here, without any manual export. The chosen file handle
   is remembered in this browser's IndexedDB so the tool can
   reconnect to the same file next time it's opened.
   ---------------------------------------------------------------- */

function idbOpen(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded=()=>{ req.result.createObjectStore(IDB_STORE); };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function idbSet(key,val){
  const db=await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put(val,key);
    tx.oncomplete=()=>resolve(true);
    tx.onerror=()=>reject(tx.error);
  });
}
async function idbGet(key){
  const db=await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(IDB_STORE,'readonly');
    const req=tx.objectStore(IDB_STORE).get(key);
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function idbDelete(key){
  const db=await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).delete(key);
    tx.oncomplete=()=>resolve(true);
    tx.onerror=()=>reject(tx.error);
  });
}

async function writeLinkedExcelFile(){
  if(!linkedFileHandle) return;
  try{
    const perm = await linkedFileHandle.queryPermission({mode:'readwrite'});
    if(perm!=='granted'){
      pendingReconnectHandle=linkedFileHandle; linkedFileHandle=null;
      if(currentPage==='datamanagement') renderDataManagement();
      return;
    }
    const wb=buildBackupWorkbook();
    const arrayBuf=XLSX.write(wb,{bookType:'xlsx',type:'array',cellStyles:true});
    const writable=await linkedFileHandle.createWritable();
    await writable.write(arrayBuf);
    await writable.close();
    lastSyncAt=new Date();
    updateLiveSyncBadge();
  }catch(err){
    console.error('Live Excel sync failed', err);
  }
}
function scheduleLiveSync(){
  if(!linkedFileHandle) return;
  clearTimeout(liveSyncTimer);
  liveSyncTimer=setTimeout(writeLinkedExcelFile,700);
}
function updateLiveSyncBadge(){
  const el=document.getElementById('liveSyncStatusText');
  if(el && linkedFileHandle) el.textContent='Last synced '+lastSyncAt.toLocaleTimeString('en-IN');
}
async function connectLiveExcel(){
  if(!FS_SUPPORTED){ toast('Live Excel sync needs Chrome, Edge, or another Chromium browser.','error'); return; }
  try{
    const handle=await window.showSaveFilePicker({
      suggestedName:'Saffron_Table_Live_Database.xlsx',
      types:[{description:'Excel Workbook',accept:{'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx']}}]
    });
    linkedFileHandle=handle; linkedFileName=handle.name; pendingReconnectHandle=null;
    await idbSet(IDB_KEY,handle);
    await writeLinkedExcelFile();
    toast('Connected — '+handle.name+' will now update automatically.');
    if(currentPage==='datamanagement') renderDataManagement();
  }catch(err){
    if(err.name!=='AbortError'){ console.error(err); toast('Could not connect the Excel file.','error'); }
  }
}
async function disconnectLiveExcel(){
  linkedFileHandle=null; linkedFileName=null; pendingReconnectHandle=null;
  try{ await idbDelete(IDB_KEY); }catch(e){}
  toast('Disconnected — the file on disk is unaffected, just no longer auto-updated.');
  if(currentPage==='datamanagement') renderDataManagement();
}
async function manualReconnectLiveExcel(){
  if(!pendingReconnectHandle){ toast('No linked file found to reconnect.','error'); return; }
  try{
    const perm=await pendingReconnectHandle.requestPermission({mode:'readwrite'});
    if(perm==='granted'){
      linkedFileHandle=pendingReconnectHandle; linkedFileName=linkedFileHandle.name; pendingReconnectHandle=null;
      await writeLinkedExcelFile();
      toast('Reconnected to '+linkedFileName);
      if(currentPage==='datamanagement') renderDataManagement();
    } else {
      toast('Permission was not granted.','error');
    }
  }catch(err){ console.error(err); toast('Could not reconnect — the file may have been moved or deleted.','error'); }
}
async function tryReconnectLiveExcelOnLoad(){
  if(!FS_SUPPORTED) return;
  try{
    const handle=await idbGet(IDB_KEY);
    if(!handle) return;
    const perm=await handle.queryPermission({mode:'readwrite'});
    if(perm==='granted'){
      linkedFileHandle=handle; linkedFileName=handle.name;
    } else {
      pendingReconnectHandle=handle; linkedFileName=handle.name;
    }
    if(currentPage==='datamanagement') renderDataManagement();
  }catch(err){ console.error('Reconnect check failed', err); }
}

/* ---------- SUPABASE SYNC ----------
   Supabase is a hosted Postgres database with an auto-generated
   REST/RPC API. Run the setup SQL once in your Supabase project's
   SQL Editor (Setup Instructions below has the full script — it's
   also provided as a standalone .sql file), then paste your Project
   URL and anon/public API key below. This tool then pushes/pulls the
   full data set to two SQL functions (sync_full_state / get_full_state)
   over HTTPS, so your data lives in real relational tables — not a
   single JSON blob — and is available from any device/browser.
   ---------------------------------------------------------------- */
const SUPABASE_SETUP_SQL = `-- ============================================================
-- Saffron Table Caterers — Supabase schema & sync functions (v2)
-- This version drops everything first for a clean slate, and uses
-- TRUNCATE instead of DELETE in sync_full_state (TRUNCATE doesn't
-- require a WHERE clause, avoiding the "DELETE requires a WHERE
-- clause" guard some Postgres/Supabase setups enforce).
-- Run this once in Supabase: Project → SQL Editor → New query → Run
-- ============================================================

-- Clean slate
drop function if exists sync_full_state(jsonb);
drop function if exists get_full_state();
drop table if exists order_items cascade;
drop table if exists invoice_items cascade;
drop table if exists payments cascade;
drop table if exists invoices cascade;
drop table if exists orders cascade;
drop table if exists customers cascade;
drop table if exists menu_items cascade;
drop table if exists expenses cascade;
drop table if exists suppliers cascade;
drop table if exists inventory cascade;
drop table if exists app_meta cascade;

);

);

  "customerName" text, "customerMobile" text, "eventName" text, "eventType" text,
  "eventDate" date, "eventTime" text, venue text, guests integer, "perPlateRate" numeric,
  "extraCharges" numeric, discount numeric, advance numeric, status text, "specialInstructions" text
);

create table order_items (
