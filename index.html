-- Row Level Security. This project is a single-business tool, so by
-- default these policies allow the anon/public API key full access —
-- the same trust level as the previous Google Sheets Web App link.
-- If you add Supabase Auth (Settings → Authentication) later, swap
-- "true" below for "auth.role() = 'authenticated'" to require login.
alter table customers enable row level security;
alter table menu_items enable row level security;
alter table orders enable row level security;
alter table order_items enable row level security;
alter table invoices enable row level security;
alter table invoice_items enable row level security;
alter table payments enable row level security;
alter table expenses enable row level security;
alter table suppliers enable row level security;
alter table inventory enable row level security;
alter table app_meta enable row level security;

do $$
declare t text;
begin
  for t in select unnest(array['customers','menu_items','orders','order_items','invoices',
    'invoice_items','payments','expenses','suppliers','inventory','app_meta'])
  loop
    execute format('drop policy if exists "allow all" on %I', t);
    execute format('create policy "allow all" on %I for all using (true) with check (true)', t);
  end loop;
end $$;

-- Atomically replaces every table's contents with the payload pushed
-- from the browser (same full-state-overwrite approach the tool
-- previously used for localStorage and Google Sheets). Uses TRUNCATE
-- rather than DELETE so it works even under strict "no unqualified
-- DELETE" guards, and one statement clears all FK-linked tables safely.
create or replace function sync_full_state(payload jsonb)
returns void
language plpgsql
security definer
as $$
begin
  truncate table order_items, invoice_items, payments, invoices, orders,
    customers, menu_items, expenses, suppliers, inventory restart identity cascade;

  insert into customers select * from jsonb_to_recordset(payload->'customers')
    as x(id int, name text, mobile text, email text, address text, gstin text, company text,
         "billingAddress" text, "eventAddress" text, notes text, state text, "createdAt" date);

  insert into menu_items select * from jsonb_to_recordset(payload->'menuItems')
    as x(id int, code text, name text, category text, unit text, rate numeric, gst numeric,
         description text, active boolean);

  insert into orders(id,"orderNo","orderDate","customerId","customerName","customerMobile",
      "eventName","eventType","eventDate","eventTime",venue,guests,"perPlateRate","extraCharges",
      discount,advance,status,"specialInstructions")
    select x.id, x."orderNo", x."orderDate",
      case when x."customerId" is not null and exists(select 1 from customers c where c.id=x."customerId") then x."customerId" else null end,
      x."customerName", x."customerMobile", x."eventName", x."eventType", x."eventDate",
      x."eventTime", x.venue, x.guests, x."perPlateRate", x."extraCharges", x.discount, x.advance,
      x.status, x."specialInstructions"
    from jsonb_to_recordset(payload->'orders')
    as x(id int, "orderNo" text, "orderDate" date, "customerId" int, "customerName" text,
         "customerMobile" text, "eventName" text, "eventType" text, "eventDate" date,
         "eventTime" text, venue text, guests int, "perPlateRate" numeric, "extraCharges" numeric,
         discount numeric, advance numeric, status text, "specialInstructions" text);

  insert into order_items("orderId","menuItemId",name,unit,rate,gst,qty)
    select * from jsonb_to_recordset(payload->'orderItems')
    as x("orderId" int, "menuItemId" int, name text, unit text, rate numeric, gst numeric, qty numeric);

  insert into invoices(id,"invoiceNo","invoiceDate","orderId","customerId","customerName",
      "customerGSTIN","customerState","eventName","eventDate",venue,"extraCharges",discount,
      subtotal,taxable,cgst,sgst,igst,"roundOff","grandTotal",advance,balance,"sameState",status)
    select x.id, x."invoiceNo", x."invoiceDate",
      case when x."orderId" is not null and exists(select 1 from orders o where o.id=x."orderId") then x."orderId" else null end,
      case when x."customerId" is not null and exists(select 1 from customers c where c.id=x."customerId") then x."customerId" else null end,
      x."customerName", x."customerGSTIN", x."customerState", x."eventName", x."eventDate", x.venue,
      x."extraCharges", x.discount, x.subtotal, x.taxable, x.cgst, x.sgst, x.igst, x."roundOff",
      x."grandTotal", x.advance, x.balance, x."sameState", x.status
    from jsonb_to_recordset(payload->'invoices')
    as x(id int, "invoiceNo" text, "invoiceDate" date, "orderId" int, "customerId" int,
         "customerName" text, "customerGSTIN" text, "customerState" text, "eventName" text,
         "eventDate" date, venue text, "extraCharges" numeric, discount numeric, subtotal numeric,
         taxable numeric, cgst numeric, sgst numeric, igst numeric, "roundOff" numeric,
         "grandTotal" numeric, advance numeric, balance numeric, "sameState" boolean, status text);

  insert into invoice_items("invoiceId",description,qty,unit,rate,gst)
    select * from jsonb_to_recordset(payload->'invoiceItems')
    as x("invoiceId" int, description text, qty numeric, unit text, rate numeric, gst numeric);

  insert into payments(id,"invoiceId","customerId",date,mode,amount,reference,remarks)
    select x.id,
      case when x."invoiceId" is not null and exists(select 1 from invoices i where i.id=x."invoiceId") then x."invoiceId" else null end,
      case when x."customerId" is not null and exists(select 1 from customers c where c.id=x."customerId") then x."customerId" else null end,
      x.date, x.mode, x.amount, x.reference, x.remarks
    from jsonb_to_recordset(payload->'payments')
    as x(id int, "invoiceId" int, "customerId" int, date date, mode text, amount numeric,
         reference text, remarks text);

  insert into expenses select * from jsonb_to_recordset(payload->'expenses')
    as x(id int, date date, category text, supplier text, description text, qty numeric,
         rate numeric, amount numeric, "paymentMode" text, remarks text);

  insert into suppliers select * from jsonb_to_recordset(payload->'suppliers')
    as x(id int, name text, contact text, mobile text, address text, gstin text,
         "itemSupplied" text, "paymentTerms" text, outstanding numeric);

  insert into inventory select * from jsonb_to_recordset(payload->'inventory')
    as x(id int, name text, category text, unit text, opening numeric, purchase numeric,
         consumption numeric, wastage numeric, closing numeric, "minLevel" numeric);

  insert into app_meta (id, seq, "invoiceYear", "invoiceCounter", "orderCounter", "updatedAt")
    values (1, payload->'seq', (payload->>'invoiceYear')::int,
            (payload->>'invoiceCounter')::int, (payload->>'orderCounter')::int, now())
  on conflict (id) do update set seq=excluded.seq, "invoiceYear"=excluded."invoiceYear",
    "invoiceCounter"=excluded."invoiceCounter", "orderCounter"=excluded."orderCounter",
    "updatedAt"=now();
end;
$$;

-- Returns the full data set as one JSON object, shaped exactly like
-- the app's in-memory state (orders/invoices include a nested "items" array).
create or replace function get_full_state()
returns jsonb
language sql
stable
security definer
as $$
  select jsonb_build_object(
    'customers', coalesce((select jsonb_agg(to_jsonb(c) order by c.id) from customers c), '[]'::jsonb),
    'menuItems', coalesce((select jsonb_agg(to_jsonb(m) order by m.id) from menu_items m), '[]'::jsonb),
    'orders', coalesce((
      select jsonb_agg(to_jsonb(o) || jsonb_build_object('items', coalesce((
        select jsonb_agg(jsonb_build_object('menuItemId',oi."menuItemId",'name',oi.name,
          'unit',oi.unit,'rate',oi.rate,'gst',oi.gst,'qty',oi.qty) order by oi.id)
        from order_items oi where oi."orderId" = o.id
      ), '[]'::jsonb)) order by o.id)
      from orders o
    ), '[]'::jsonb),
    'invoices', coalesce((
      select jsonb_agg(to_jsonb(i) || jsonb_build_object('items', coalesce((
        select jsonb_agg(jsonb_build_object('description',ii.description,'qty',ii.qty,
          'unit',ii.unit,'rate',ii.rate,'gst',ii.gst) order by ii.id)
        from invoice_items ii where ii."invoiceId" = i.id
      ), '[]'::jsonb)) order by i.id)
      from invoices i
    ), '[]'::jsonb),
    'payments', coalesce((select jsonb_agg(to_jsonb(p) order by p.id) from payments p), '[]'::jsonb),
    'expenses', coalesce((select jsonb_agg(to_jsonb(e) order by e.id) from expenses e), '[]'::jsonb),
    'suppliers', coalesce((select jsonb_agg(to_jsonb(s) order by s.id) from suppliers s), '[]'::jsonb),
    'inventory', coalesce((select jsonb_agg(to_jsonb(v) order by v.id) from inventory v), '[]'::jsonb),
    'seq', (select seq from app_meta where id=1),
    'invoiceYear', (select "invoiceYear" from app_meta where id=1),
    'invoiceCounter', (select "invoiceCounter" from app_meta where id=1),
    'orderCounter', (select "orderCounter" from app_meta where id=1)
  );
$$;

grant execute on function sync_full_state(jsonb) to anon, authenticated;
grant execute on function get_full_state() to anon, authenticated;
`;

function loadSupabaseConfig(){
  try{
    const raw=localStorage.getItem(SUPABASE_CONFIG_KEY);
    if(!raw) return;
    const cfg=JSON.parse(raw);
    supabaseUrl=cfg.url||null;
    supabaseAnonKey=cfg.key||null;
    supabaseAutoSync=!!cfg.autoSync;
  }catch(err){ console.error('Could not load Supabase config', err); }
}
function saveSupabaseConfig(){
  try{ localStorage.setItem(SUPABASE_CONFIG_KEY, JSON.stringify({url:supabaseUrl, key:supabaseAnonKey, autoSync:supabaseAutoSync})); }
  catch(err){ console.error('Could not save Supabase config', err); }
}
function initSupabaseClient(){
  if(supabaseUrl && supabaseAnonKey && window.supabase && window.supabase.createClient){
    try{
      supabaseClient=window.supabase.createClient(supabaseUrl,supabaseAnonKey);
      if(supabaseAutoSync){
        startSupabaseHeartbeat();
        setTimeout(()=>pushToSupabase(true),1500);
      }
    }
    catch(err){ console.error('Could not create Supabase client', err); supabaseClient=null; }
  }
}
function buildSupabasePayload(){
  const orderItems=[];
  state.orders.forEach(o=>(o.items||[]).forEach(it=>orderItems.push({
    orderId:o.id, menuItemId:it.menuItemId||null, name:it.name, unit:it.unit, rate:it.rate, gst:it.gst, qty:it.qty
  })));
  const invoiceItems=[];
  state.invoices.forEach(i=>(i.items||[]).forEach(it=>invoiceItems.push({
    invoiceId:i.id, description:it.description, qty:it.qty, unit:it.unit, rate:it.rate, gst:it.gst
  })));
  return {
    customers:state.customers, menuItems:state.menuItems, orders:state.orders, orderItems,
    invoices:state.invoices, invoiceItems, payments:state.payments, expenses:state.expenses,
    suppliers:state.suppliers, inventory:state.inventory,
    seq:state.seq, invoiceYear:state.invoiceYear, invoiceCounter:state.invoiceCounter, orderCounter:state.orderCounter
  };
}
async function pushToSupabase(silent){
  if(!supabaseClient) return;
  try{
    const {error}=await supabaseClient.rpc('sync_full_state',{payload:buildSupabasePayload()});
    if(error) throw error;
    supabaseLastSyncAt=new Date(); supabaseLastStatus='ok'; supabaseLastError=null;
    updateSupabaseSyncBadge();
    if(!silent) toast('Pushed to Supabase successfully.');
  }catch(err){
    console.error('Push to Supabase failed', err);
    supabaseLastStatus='error';
    supabaseLastError = (err && (err.message||err.hint||err.details)) || String(err);
    updateSupabaseSyncBadge();
    toast('Auto-sync to Supabase failed: '+supabaseLastError,'error');
  }
}
async function pullFromSupabase(){
  if(!supabaseClient){ toast('Add and save your Supabase URL and API key first.','error'); return; }
  try{
    const {data,error}=await supabaseClient.rpc('get_full_state');
    if(error) throw error;
    const empty=!data || (!(data.customers||[]).length && !(data.orders||[]).length && !(data.invoices||[]).length && !(data.menuItems||[]).length);
    if(empty){ toast('That Supabase project has no Saffron Table data yet — push first.','error'); return; }
    confirmAction('Pulling from Supabase will replace all current application data with what is stored there. Continue?', ()=>{
      state.customers=data.customers||[]; state.menuItems=data.menuItems||[]; state.orders=data.orders||[];
      state.invoices=data.invoices||[]; state.payments=data.payments||[]; state.expenses=data.expenses||[];
      state.suppliers=data.suppliers||[]; state.inventory=data.inventory||[];
      state.seq=data.seq||state.seq; state.invoiceYear=data.invoiceYear||state.invoiceYear;
      state.invoiceCounter=data.invoiceCounter||state.invoiceCounter; state.orderCounter=data.orderCounter||state.orderCounter;
      recalcAllDerived();
      saveData();
      toast('Data pulled from Supabase successfully.');
      goTo('dashboard');
    },'Pull & Replace');
  }catch(err){
    console.error('Pull from Supabase failed', err);
    toast('Could not reach Supabase — check your Project URL / API key and connection.','error');
  }
}
async function saveAndTestSupabaseURL(){
  const urlInput=document.getElementById('supabaseUrlInput');
  const keyInput=document.getElementById('supabaseKeyInput');
  const url=(urlInput?urlInput.value:'').trim();
  const key=(keyInput?keyInput.value:'').trim();
  if(!url || !key){ toast('Enter both your Supabase Project URL and anon/public API key.','error'); return; }
  if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(url)){
    toast('That does not look like a Supabase Project URL (should look like https://xxxx.supabase.co).','error'); return;
  }
  toast('Testing connection…');
  try{
    const client=window.supabase.createClient(url,key);
    const {error}=await client.rpc('get_full_state');
    if(error) throw error;
    supabaseUrl=url; supabaseAnonKey=key; supabaseAutoSync=true; supabaseClient=client;
    saveSupabaseConfig();
    toast('Connected — auto-sync is now on. Pushing your current data…');
    await pushToSupabase(true);
    startSupabaseHeartbeat();
    renderDataManagement();
  }catch(err){
    console.error(err);
    toast('Could not connect — check the URL/key, and make sure you ran the setup SQL in the Supabase SQL Editor first.','error');
  }
}
function toggleSupabaseAutoSync(checked){
  supabaseAutoSync=checked;
  saveSupabaseConfig();
  toast(supabaseAutoSync?'Auto-sync to Supabase enabled.':'Auto-sync to Supabase disabled.');
}
function disconnectSupabase(){
  supabaseUrl=null; supabaseAnonKey=null; supabaseAutoSync=false; supabaseLastStatus=null; supabaseLastSyncAt=null; supabaseClient=null;
  saveSupabaseConfig();
  toast('Disconnected from Supabase.');
  renderDataManagement();
}
function scheduleSupabaseSync(){
  if(!supabaseClient || !supabaseAutoSync) return;
  clearTimeout(supabaseSyncTimer);
  supabaseSyncTimer=setTimeout(()=>pushToSupabase(true),900);
}
function startSupabaseHeartbeat(){
  clearInterval(supabaseHeartbeat);
  supabaseHeartbeat=setInterval(()=>{
    if(supabaseClient && supabaseAutoSync) pushToSupabase(true);
  },60000);
}
function updateSupabaseSyncBadge(){
  const el=document.getElementById('supabaseSyncStatusText');
  if(el && supabaseUrl){
    el.textContent = supabaseLastStatus==='error' ? ('Last sync failed: '+(supabaseLastError||'unknown error')) : ('Last synced '+(supabaseLastSyncAt?supabaseLastSyncAt.toLocaleTimeString('en-IN'):'—'));
    el.style.color = supabaseLastStatus==='error' ? 'var(--danger)' : 'var(--success)';
  }
}

/* ---------- Excel import ---------- */
const REQUIRED_SHEETS = {
  'Customers':['Customer ID','Customer Name','Mobile'],
  'Menu Items':['Menu Item ID','Item Name','Rate'],
  'Catering Orders':['Order ID','Order Number','Customer ID'],
  'Order Items':['Order ID','Item Name','Quantity','Rate'],
  'Invoices':['Invoice ID','Invoice Number','Customer ID','Grand Total'],
  'Invoice Items':['Invoice ID','Description','Quantity','Rate'],
  'Payments':['Payment ID','Invoice ID','Amount'],
  'Expenses':['Expense ID','Date','Amount'],
  'Suppliers':['Supplier ID','Supplier Name'],
  'Inventory':['Inventory ID','Item Name']
};
function triggerExcelImport(){
  const input=document.getElementById('excelImportInput');
  input.value='';
  input.onchange=(e)=>{
    const file=e.target.files[0];
    if(!file) return;
    if(!/\.(xlsx|xls)$/i.test(file.name)){ toast('Invalid Excel file.','error'); return; }
    const reader=new FileReader();
    reader.onload=(ev)=>{
      let wb;
      try{ wb=XLSX.read(ev.target.result,{type:'array'}); }
      catch(err){ toast('Invalid Excel file.','error'); return; }
      const validation=validateWorkbook(wb);
      if(!validation.ok){ toast(validation.message,'error'); return; }
      askImportMode(wb);
    };
    reader.onerror=()=>toast('Could not read the selected file.','error');
    reader.readAsArrayBuffer(file);
  };
  input.click();
}
function validateWorkbook(wb){
  for(const sheetName of Object.keys(REQUIRED_SHEETS)){
    if(!wb.SheetNames.includes(sheetName)){
      return {ok:false, message:`Required worksheet missing: ${sheetName}`};
    }
    const ws=wb.Sheets[sheetName];
    const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
    if(rows.length){
      const cols=Object.keys(rows[0]);
      for(const reqCol of REQUIRED_SHEETS[sheetName]){
        if(!cols.includes(reqCol)){
          return {ok:false, message:`Required column missing: ${reqCol} (in ${sheetName})`};
        }
      }
    }
  }
  return {ok:true};
}
function askImportMode(wb){
  openModal(`
    <div class="modal-head"><h3>Import Excel Backup</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <div class="modal-body">
      <p style="font-size:13.5px;line-height:1.6;">Importing Excel will replace current application data. Do you want to continue?</p>
      <p class="hint">Choose <b>Import &amp; Replace</b> to wipe current data and load only the file's contents, or <b>Import &amp; Merge</b> to keep existing records and add the file's records alongside them.</p>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-outline" onclick="runExcelImport(window.__pendingWB,'merge')">Import &amp; Merge</button>
      <button class="btn btn-primary" onclick="runExcelImport(window.__pendingWB,'replace')">Import &amp; Replace</button>
    </div>
  `);
  window.__pendingWB=wb;
}
function sheetRows(wb,name){ return wb.SheetNames.includes(name) ? XLSX.utils.sheet_to_json(wb.Sheets[name],{defval:''}) : []; }
function runExcelImport(wb,mode){
  closeModal();
  try{
    const cRows=sheetRows(wb,'Customers'), mRows=sheetRows(wb,'Menu Items'), oRows=sheetRows(wb,'Catering Orders'),
          oiRows=sheetRows(wb,'Order Items'), iRows=sheetRows(wb,'Invoices'), iiRows=sheetRows(wb,'Invoice Items'),
          pRows=sheetRows(wb,'Payments'), eRows=sheetRows(wb,'Expenses'), sRows=sheetRows(wb,'Suppliers'), invRows=sheetRows(wb,'Inventory');

    const custIdMap={}, menuIdMap={}, orderIdMap={}, invIdMap={};
    const startId = (collection)=> mode==='merge' ? Math.max(0,...state[collection].map(x=>x.id||0))+1 : 1;

    // Customers
    let nextCustId = startId('customers');
    const newCustomers = cRows.map(r=>{
      const origId=idNum(r['Customer ID']);
      const id = mode==='replace' ? (origId||nextCustId++) : nextCustId++;
      if(origId!=null) custIdMap[origId]=id;
      return {id, name:r['Customer Name']||'', mobile:String(r['Mobile']||''), email:r['Email']||'', address:r['Address']||'', gstin:r['GSTIN']||'', company:r['Company']||'', billingAddress:r['Billing Address']||'', eventAddress:r['Event Address']||'', notes:r['Notes']||'', state:r['State']||BUSINESS.state, createdAt:fromDMY(r['Created Date'])||todayISO()};
    });

    // Menu Items
    let nextMenuId = startId('menuItems');
    const newMenu = mRows.map(r=>{
      const origId=idNum(r['Menu Item ID']);
      const id = mode==='replace' ? (origId||nextMenuId++) : nextMenuId++;
      if(origId!=null) menuIdMap[origId]=id;
      return {id, code:r['Item Code']||('FI'+id), name:r['Item Name']||'', category:r['Category']||MENU_CATEGORIES[0], unit:r['Unit']||UNITS[0], rate:parseFloat(r['Rate'])||0, gst:parseInt(r['GST Rate'])||0, description:r['Description']||'', active:yesNo(r['Active'])};
    });

    // Orders + items
    let nextOrderId = startId('orders');
    const orderItemsByOrderId={};
    oiRows.forEach(r=>{
      const oId=idNum(r['Order ID']);
      if(oId==null) return;
      (orderItemsByOrderId[oId]=orderItemsByOrderId[oId]||[]).push({
        menuItemId: menuIdMap[idNum(r['Menu Item ID'])] || idNum(r['Menu Item ID']) || null,
        name:r['Item Name']||'', unit:r['Unit']||'', qty:parseFloat(r['Quantity'])||0, rate:parseFloat(r['Rate'])||0, gst:parseInt(r['GST Rate'])||0
      });
    });
    const newOrders = oRows.map(r=>{
      const origId=idNum(r['Order ID']);
      const id = mode==='replace' ? (origId||nextOrderId++) : nextOrderId++;
      if(origId!=null) orderIdMap[origId]=id;
      const mappedCustId = custIdMap[idNum(r['Customer ID'])] || idNum(r['Customer ID']);
      return {
        id, orderNo:r['Order Number']||('ORD-'+state.invoiceYear+'-'+String(id).padStart(4,'0')), orderDate:fromDMY(r['Order Date'])||todayISO(),
        customerId:mappedCustId, customerName:r['Customer Name']||'', customerMobile:r['Customer Mobile']||'',
        eventName:r['Event Name']||'', eventType:r['Event Type']||EVENT_TYPES[0], eventDate:fromDMY(r['Event Date'])||todayISO(),
        eventTime:r['Event Time']||'', venue:r['Venue']||'', guests:parseInt(r['Guests'])||1, perPlateRate:parseFloat(r['Per Plate Rate'])||0,
        items: (origId!=null && orderItemsByOrderId[origId]) ? orderItemsByOrderId[origId] : [],
        extraCharges:parseFloat(r['Extra Charges'])||0, discount:parseFloat(r['Discount'])||0, advance:parseFloat(r['Advance'])||0,
        status:r['Status']||'Confirmed', specialInstructions:r['Special Instructions']||''
      };
    });

    // Invoices + items
    let nextInvId = startId('invoices');
    const invItemsByInvId={};
    iiRows.forEach(r=>{
      const iId=idNum(r['Invoice ID']);
      if(iId==null) return;
      (invItemsByInvId[iId]=invItemsByInvId[iId]||[]).push({description:r['Description']||'', qty:parseFloat(r['Quantity'])||0, unit:r['Unit']||'', rate:parseFloat(r['Rate'])||0, gst:parseInt(r['GST Rate'])||0});
    });
    const newInvoices = iRows.map(r=>{
      const origId=idNum(r['Invoice ID']);
      const id = mode==='replace' ? (origId||nextInvId++) : nextInvId++;
      if(origId!=null) invIdMap[origId]=id;
      const mappedCustId = custIdMap[idNum(r['Customer ID'])] || idNum(r['Customer ID']);
      const mappedOrderId = orderIdMap[idNum(r['Order ID'])] || idNum(r['Order ID']) || null;
      return {
        id, invoiceNo:r['Invoice Number']||('INV-'+state.invoiceYear+'-'+String(id).padStart(4,'0')), invoiceDate:fromDMY(r['Invoice Date'])||todayISO(),
        orderId:mappedOrderId, customerId:mappedCustId, customerName:r['Customer Name']||'', customerGSTIN:r['Customer GSTIN']||'', customerState:r['Customer State']||BUSINESS.state,
        eventName:r['Event Name']||'', eventDate:fromDMY(r['Event Date'])||'', venue:r['Venue']||'',
        items:(origId!=null && invItemsByInvId[origId]) ? invItemsByInvId[origId] : [],
        subtotal:parseFloat(r['Subtotal'])||0, taxable:parseFloat(r['Taxable Amount'])||0, cgst:parseFloat(r['CGST'])||0, sgst:parseFloat(r['SGST'])||0, igst:parseFloat(r['IGST'])||0,
        roundOff:parseFloat(r['Round Off'])||0, grandTotal:parseFloat(r['Grand Total'])||0, advance:parseFloat(r['Advance'])||0, balance:parseFloat(r['Balance'])||0,
        sameState:yesNo(r['Same State']), status:r['Status']||'Pending'
      };
    });

    // Payments
    let nextPayId = startId('payments');
    const newPayments = pRows.map(r=>{
      const origId=idNum(r['Payment ID']);
      const id = mode==='replace' ? (origId||nextPayId++) : nextPayId++;
      const mappedInvId = invIdMap[idNum(r['Invoice ID'])] || idNum(r['Invoice ID']);
      const mappedCustId = custIdMap[idNum(r['Customer ID'])] || idNum(r['Customer ID']);
      return {id, invoiceId:mappedInvId, customerId:mappedCustId, date:fromDMY(r['Date'])||todayISO(), mode:r['Payment Mode']||'Cash', amount:parseFloat(r['Amount'])||0, reference:r['Reference']||'', remarks:r['Remarks']||''};
    });

    // Expenses
    let nextExpId = startId('expenses');
    const newExpenses = eRows.map(r=>{
      const origId=idNum(r['Expense ID']);
      const id = mode==='replace' ? (origId||nextExpId++) : nextExpId++;
      return {id, date:fromDMY(r['Date'])||todayISO(), category:r['Category']||EXPENSE_CATEGORIES[0], supplier:r['Supplier']||'', description:r['Description']||'', qty:parseFloat(r['Quantity'])||0, rate:parseFloat(r['Rate'])||0, amount:parseFloat(r['Amount'])||0, paymentMode:r['Payment Mode']||'Cash', remarks:r['Remarks']||''};
    });

    // Suppliers
    let nextSupId = startId('suppliers');
    const newSuppliers = sRows.map(r=>{
      const origId=idNum(r['Supplier ID']);
      const id = mode==='replace' ? (origId||nextSupId++) : nextSupId++;
      return {id, name:r['Supplier Name']||'', contact:r['Contact Person']||'', mobile:r['Mobile']||'', address:r['Address']||'', gstin:r['GSTIN']||'', itemSupplied:r['Item Supplied']||'', paymentTerms:r['Payment Terms']||'', outstanding:parseFloat(r['Outstanding'])||0};
    });

    // Inventory
    let nextInvyId = startId('inventory');
    const newInventory = invRows.map(r=>{
      const origId=idNum(r['Inventory ID']);
      const id = mode==='replace' ? (origId||nextInvyId++) : nextInvyId++;
      const item={id, name:r['Item Name']||'', category:r['Category']||'', unit:r['Unit']||'', opening:parseFloat(r['Opening Stock'])||0, purchase:parseFloat(r['Purchase'])||0, consumption:parseFloat(r['Consumption'])||0, wastage:parseFloat(r['Wastage'])||0, minLevel:parseFloat(r['Minimum Stock Level'])||0};
      recalcInventoryClosing(item);
      return item;
    });

    if(mode==='replace'){
      state.customers=newCustomers; state.menuItems=newMenu; state.orders=newOrders; state.invoices=newInvoices;
      state.payments=newPayments; state.expenses=newExpenses; state.suppliers=newSuppliers; state.inventory=newInventory;
    } else {
      state.customers=state.customers.concat(newCustomers);
      state.menuItems=state.menuItems.concat(newMenu);
      state.orders=state.orders.concat(newOrders);
      state.invoices=state.invoices.concat(newInvoices);
      state.payments=state.payments.concat(newPayments);
      state.expenses=state.expenses.concat(newExpenses);
      state.suppliers=state.suppliers.concat(newSuppliers);
      state.inventory=state.inventory.concat(newInventory);
    }

    recalcSeqCounters();
    recalcAllDerived();
    saveData();
    toast('Excel data imported successfully.');
    goTo('dashboard');
  }catch(err){
    console.error(err);
    toast('Import failed — the file may contain unexpected data. No changes were made to sheets that failed.','error');
  }
}
function recalcSeqCounters(){
  const maxId=(arr)=>arr.reduce((m,r)=>Math.max(m,parseInt(r.id)||0),0);
  state.seq.customer=maxId(state.customers)+1;
  state.seq.menu=maxId(state.menuItems)+1;
  state.seq.order=maxId(state.orders)+1;
  state.seq.invoice=maxId(state.invoices)+1;
  state.seq.payment=maxId(state.payments)+1;
  state.seq.expense=maxId(state.expenses)+1;
  state.seq.supplier=maxId(state.suppliers)+1;
  state.seq.inventory=maxId(state.inventory)+1;
  let maxOrderSeq=0, maxInvSeq=0;
  state.orders.forEach(o=>{ const m=(o.orderNo||'').match(/ORD-(\d{4})-(\d+)/); if(m) maxOrderSeq=Math.max(maxOrderSeq,parseInt(m[2])); });
  state.invoices.forEach(i=>{ const m=(i.invoiceNo||'').match(/INV-(\d{4})-(\d+)/); if(m) maxInvSeq=Math.max(maxInvSeq,parseInt(m[2])); });
  state.orderCounter=Math.max(state.orderCounter,maxOrderSeq+1);
  state.invoiceCounter=Math.max(state.invoiceCounter,maxInvSeq+1);
}

/* ---------- JSON backup / restore ---------- */
function exportJSONBackup(){
  try{
    const payload={
      customers:state.customers, menuItems:state.menuItems, orders:state.orders, invoices:state.invoices,
      payments:state.payments, expenses:state.expenses, suppliers:state.suppliers, inventory:state.inventory,
      seq:state.seq, invoiceYear:state.invoiceYear, invoiceCounter:state.invoiceCounter, orderCounter:state.orderCounter,
      exportedAt:new Date().toISOString()
    };
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const ts=new Date();
    const fname=`Saffron_Table_JSON_Backup_${ts.getFullYear()}-${pad2(ts.getMonth()+1)}-${pad2(ts.getDate())}_${pad2(ts.getHours())}-${pad2(ts.getMinutes())}.json`;
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fname; a.click();
    toast('JSON backup downloaded: '+fname);
  }catch(err){ console.error(err); toast('Could not create the JSON backup','error'); }
}
function triggerJSONImport(){
  const input=document.getElementById('jsonImportInput');
  input.value='';
  input.onchange=(e)=>{
    const file=e.target.files[0];
    if(!file) return;
    if(!/\.json$/i.test(file.name)){ toast('Please select a .json backup file.','error'); return; }
    const reader=new FileReader();
    reader.onload=(ev)=>{
      let data;
      try{ data=JSON.parse(ev.target.result); }
      catch(err){ toast('That file is not valid JSON.','error'); return; }
      if(!data || !Array.isArray(data.customers) || !Array.isArray(data.invoices)){
        toast('That file does not look like a valid Saffron Table backup.','error'); return;
      }
      confirmAction('Restoring this JSON backup will replace all current application data. Continue?', ()=>{
        state.customers=data.customers||[]; state.menuItems=data.menuItems||[]; state.orders=data.orders||[];
        state.invoices=data.invoices||[]; state.payments=data.payments||[]; state.expenses=data.expenses||[];
        state.suppliers=data.suppliers||[]; state.inventory=data.inventory||[];
        state.seq=data.seq||state.seq; state.invoiceYear=data.invoiceYear||state.invoiceYear;
        state.invoiceCounter=data.invoiceCounter||state.invoiceCounter; state.orderCounter=data.orderCounter||state.orderCounter;
        recalcAllDerived();
        saveData();
        toast('JSON backup restored successfully.');
        goTo('dashboard');
      },'Import & Replace');
    };
    reader.onerror=()=>toast('Could not read the selected file.','error');
    reader.readAsText(file);
  };
  input.click();
}

/* ============================================================
   SMART NOTIFICATION & ALERT SYSTEM
   Reads live data from state.invoices / state.payments / state.orders /
   state.inventory — does not duplicate or create separate business
   records. Only read/unread/dismissed flags + settings are persisted,
   under their own localStorage key (kept separate from LS_KEY so the
   existing save/load/Excel/Supabase payloads are untouched).
   ============================================================ */
function loadNotifState(){
  try{
    const raw=localStorage.getItem(NOTIF_STATE_KEY);
    if(!raw) return;
    const d=JSON.parse(raw);
    notifState.read = d.read||{};
    notifState.dismissed = d.dismissed||{};
    notifState.notifiedIds = d.notifiedIds||{};
    notifState.settings = Object.assign({},notifState.settings, d.settings||{});
  }catch(err){ console.error('Could not load notification state', err); }
}
function saveNotifState(){
  try{ localStorage.setItem(NOTIF_STATE_KEY, JSON.stringify(notifState)); }
  catch(err){ console.error('Could not save notification state', err); }
}
function sevRank(s){ return {high:3,medium:2,low:1,info:0}[s]||0; }
function sevEmoji(s){ return {high:'🔴',medium:'🟠',low:'🟡',info:'🔵'}[s]||'⚪'; }
function notifDaysSince(iso,today){ return Math.max(0,Math.round((new Date(today+'T00:00:00')-new Date(iso+'T00:00:00'))/86400000)); }
function notifDaysUntil(iso,today){ return Math.round((new Date(iso+'T00:00:00')-new Date(today+'T00:00:00'))/86400000); }

function computeNotifications(){
  const ns=notifState.settings;
  const today=todayISO();
  const list=[];

  if(ns.paymentDue){
    state.invoices.filter(inv=>inv.status!=='Cancelled' && inv.balance>0.01).forEach(inv=>{
      const age=notifDaysSince(inv.invoiceDate,today);
      const severity = age>30?'high':(age>=15?'medium':'low');
      const custName=escapeHtml(inv.customerName||'');
      list.push({
        id:'payment-due-invoice-'+inv.id, category:'payment', severity,
        title:'Payment Due',
        desc:custName+' has '+rupee(inv.balance)+' outstanding.',
        meta:'Invoice '+escapeHtml(inv.invoiceNo)+' &middot; Outstanding for '+age+' day'+(age===1?'':'s'),
        date:inv.invoiceDate,
        actionLabel:'View Invoice',
        action:{type:'invoice',id:inv.id}
      });
    });
  }

  if(ns.pendingInvoice){
    state.invoices.filter(inv=>inv.status!=='Cancelled' && (inv.status==='Pending'||inv.status==='Partially Paid'||inv.balance>0.01)).forEach(inv=>{
      const custName=escapeHtml(inv.customerName||'');
      list.push({
        id:'invoice-pending-'+inv.id, category:'invoice', severity:'medium',
        title:'Invoice Pending',
        desc:escapeHtml(inv.invoiceNo)+' has an outstanding balance.',
        meta:custName+' &middot; '+escapeHtml(inv.status),
        date:inv.invoiceDate,
        actionLabel:'View Invoice',
        action:{type:'invoice',id:inv.id}
      });
    });
  }

  if(ns.upcomingEvents){
    const cap = ns.eventReminderDays==null?7:ns.eventReminderDays;
    state.orders.forEach(o=>{
      if(!o.eventDate) return;
      const daysAhead = notifDaysUntil(o.eventDate,today);
      if(daysAhead<0 || daysAhead>cap) return;
      let severity;
      if(daysAhead===0) severity='high';
      else if(daysAhead===1) severity='medium';
      else if(daysAhead<=7) severity='low';
      else severity='info';
      const custName=escapeHtml(o.customerName||'');
      list.push({
        id:'upcoming-event-'+o.id, category:'event', severity,
        title:'Upcoming Event',
        desc:escapeHtml(o.eventName)+' is '+(daysAhead===0?'today':daysAhead===1?'tomorrow':('in '+daysAhead+' days'))+'.',
        meta:custName+' &middot; '+fmtDate(o.eventDate)+(o.eventTime?(' &middot; '+escapeHtml(o.eventTime)):'')+(o.venue?(' &middot; '+escapeHtml(o.venue)):''),
        date:o.eventDate,
        actionLabel:'View Event',
        action:{type:'order',id:o.id}
      });
    });
  }

  if(ns.lowStock){
    state.inventory.forEach(i=>{
      const closing = i.closing||0, min = i.minLevel||0;
      if(closing<=0){
        list.push({
          id:'low-stock-item-'+i.id, category:'stock', severity:'high',
          title:'Out of Stock',
          desc:escapeHtml(i.name)+' is out of stock.',
          meta:'Current Stock: 0 '+escapeHtml(i.unit||''),
          date:today, actionLabel:'View Inventory', action:{type:'inventory'}
        });
      } else if(closing<=min){
        list.push({
          id:'low-stock-item-'+i.id, category:'stock', severity:'medium',
          title:'Low Stock',
          desc:escapeHtml(i.name)+' stock is below minimum level.',
          meta:'Current: '+closing+' '+escapeHtml(i.unit||'')+' &middot; Minimum: '+min+' '+escapeHtml(i.unit||''),
          date:today, actionLabel:'View Inventory', action:{type:'inventory'}
        });
      }
    });
  }

  const filtered = list.filter(n=>!notifState.dismissed[n.id]);
  filtered.sort((a,b)=> sevRank(b.severity)-sevRank(a.severity) || String(b.date).localeCompare(String(a.date)));
  return filtered;
}
function getNotifSummary(list){
  return {
    payment:list.filter(n=>n.category==='payment').length,
    event:list.filter(n=>n.category==='event').length,
    stock:list.filter(n=>n.category==='stock').length,
    invoice:list.filter(n=>n.category==='invoice').length,
  };
}

    </div>
    <div class="notif-dropdown-body">
      ${top.length? top.map(n=>renderNotifItemHtml(n)).join('') : '<div class="notif-empty">No active alerts — all caught up!</div>'}
    </div>
    <div class="notif-dropdown-foot">
      <span class="muted" style="font-size:11px;">Total Alerts: ${list.length}</span>
      <button class="btn btn-outline btn-sm" onclick="toggleNotifDropdown();goTo('notifications')">View All</button>
    </div>
  `;
}

  const c=document.querySelector('.page');
  const list=computeNotifications();
  const summary=getNotifSummary(list);
  c.innerHTML=`
  <div class="section-head">
    <div><h2>Notifications</h2><div class="desc">Total Alerts: ${list.length}</div></div>
    <div class="section-actions">
      <button class="btn btn-outline" onclick="notifMarkAllRead()">Mark All as Read</button>
      <button class="btn btn-outline" onclick="notifClearRead()">Clear Read Notifications</button>
    </div>
  </div>
  <div class="notif-summary-grid">
    <div class="notif-summary-card" style="border-left:3px solid var(--danger);"><div class="l">💰 Payment Due</div><div class="v">${summary.payment}</div></div>
    <div class="notif-summary-card" style="border-left:3px solid var(--primary);"><div class="l">📅 Upcoming Events</div><div class="v">${summary.event}</div></div>
    <div class="notif-summary-card" style="border-left:3px solid var(--warn);"><div class="l">📦 Low Stock</div><div class="v">${summary.stock}</div></div>
    <div class="notif-summary-card" style="border-left:3px solid var(--gold);"><div class="l">🧾 Pending Invoices</div><div class="v">${summary.invoice}</div></div>
  </div>
  <div class="notif-filters">
    ${[['all','All'],['payment','Payment Due'],['event','Upcoming Events'],['stock','Low Stock'],['invoice','Invoice Pending']].map(([k,l])=>`<button class="report-tab ${notifPageFilter===k?'active':''}" onclick="notifSetFilter('${k}')">${l}</button>`).join('')}
    <span style="width:12px;display:inline-block;"></span>
    ${[['all','All'],['unread','Unread'],['read','Read']].map(([k,l])=>`<button class="report-tab ${notifPageReadFilter===k?'active':''}" onclick="notifSetReadFilter('${k}')">${l}</button>`).join('')}
  </div>
  <div class="notif-list-card" id="notifListSection"></div>

  <div class="panel notif-settings-panel">
    <div class="panel-title" style="margin-bottom:6px;">Notification Settings</div>
    <div class="notif-settings-row"><label>Payment Due Alerts</label><label class="switch"><input type="checkbox" ${notifState.settings.paymentDue?'checked':''} onchange="toggleNotifSetting('paymentDue',this.checked)"><span class="slider"></span></label></div>
    <div class="notif-settings-row"><label>Upcoming Event Alerts</label><label class="switch"><input type="checkbox" ${notifState.settings.upcomingEvents?'checked':''} onchange="toggleNotifSetting('upcomingEvents',this.checked)"><span class="slider"></span></label></div>
    <div class="notif-settings-row"><label>Low Stock Alerts</label><label class="switch"><input type="checkbox" ${notifState.settings.lowStock?'checked':''} onchange="toggleNotifSetting('lowStock',this.checked)"><span class="slider"></span></label></div>
    <div class="notif-settings-row"><label>Pending Invoice Alerts</label><label class="switch"><input type="checkbox" ${notifState.settings.pendingInvoice?'checked':''} onchange="toggleNotifSetting('pendingInvoice',this.checked)"><span class="slider"></span></label></div>
    <div class="notif-settings-row"><label>Browser Notifications</label><label class="switch"><input type="checkbox" ${notifState.settings.browserNotif?'checked':''} onchange="toggleBrowserNotif(this.checked)"><span class="slider"></span></label></div>
    <div class="notif-settings-row"><label>Event Reminder Window</label>
      <select onchange="setEventReminderDays(this.value)" style="padding:6px 9px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;background:#fff;">
        ${[[0,'Today'],[1,'1 day before'],[3,'3 days before'],[7,'7 days before'],[30,'30 days before']].map(([v,l])=>`<option value="${v}" ${notifState.settings.eventReminderDays===v?'selected':''}>${l}</option>`).join('')}
      </select>
    </div>
  </div>
  `;
  renderNotifListSection();
}
function renderNotifListSection(){
  const wrap=document.getElementById('notifListSection');
  if(!wrap) return;
  let list=computeNotifications();
  if(notifPageFilter!=='all') list=list.filter(n=>n.category===notifPageFilter);
  if(notifPageReadFilter==='unread') list=list.filter(n=>!notifState.read[n.id]);
  else if(notifPageReadFilter==='read') list=list.filter(n=>notifState.read[n.id]);
  wrap.innerHTML = list.length? list.map(n=>renderNotifItemHtml(n)).join('') : `<div class="notif-empty">No notifications in this view.</div>`;
}
function notifSetFilter(k){ notifPageFilter=k; renderNotificationsPage(); }
function notifSetReadFilter(k){ notifPageReadFilter=k; renderNotificationsPage(); }

function toggleNotifSetting(key,val){
  notifState.settings[key]=val; saveNotifState(); refreshNotifBadge();
  if(currentPage==='notifications') renderNotificationsPage();
}
function setEventReminderDays(v){
  notifState.settings.eventReminderDays=parseInt(v); saveNotifState(); refreshNotifBadge();
  if(currentPage==='notifications') renderNotificationsPage();
}
function toggleBrowserNotif(checked){
  if(checked){
    if(!('Notification' in window)){
      toast('Browser notifications are not supported in this browser','error');
      notifState.settings.browserNotif=false; saveNotifState();
      if(currentPage==='notifications') renderNotificationsPage();
      return;
    }
    Notification.requestPermission().then(perm=>{
      notifState.settings.browserNotif = perm==='granted';
      toast(perm==='granted'?'Browser notifications enabled':'Browser notification permission denied','error');
      saveNotifState();
      if(currentPage==='notifications') renderNotificationsPage();
    });
  } else {
    notifState.settings.browserNotif=false; saveNotifState();
  }
}
function maybeSendBrowserNotifications(list){
  if(!notifState.settings.browserNotif || !('Notification' in window) || Notification.permission!=='granted') return;
  let changed=false;
  list.filter(n=>n.severity==='high' && !notifState.notifiedIds[n.id]).forEach(n=>{
    try{ new Notification(n.title, {body:n.desc.replace(/&middot;/g,'·')}); }catch(err){ console.error('Browser notification failed',err); }
    notifState.notifiedIds[n.id]=true; changed=true;
  });
  if(changed) saveNotifState();
}

function notifMarkRead(id){ notifState.read[id]=true; saveNotifState(); refreshNotifBadge(); }
function notifMarkAllRead(){
  computeNotifications().forEach(n=>notifState.read[n.id]=true);
  saveNotifState(); toast('All notifications marked as read'); refreshNotifBadge();
  if(currentPage==='notifications') renderNotificationsPage();
}
function notifClearRead(){
  const active=computeNotifications();
  let cleared=0;
  active.forEach(n=>{ if(notifState.read[n.id]){ notifState.dismissed[n.id]=true; cleared++; } });
  saveNotifState();
  toast(cleared? cleared+' read notification(s) cleared' : 'No read notifications to clear');
  refreshNotifBadge();
  if(currentPage==='notifications') renderNotificationsPage();
}
function notifAction(id){
  const n=(notifCache.length?notifCache:computeNotifications()).find(x=>x.id===id);
  if(!n) return;
  notifMarkRead(id);
  const dd=document.getElementById('notifDropdown'); if(dd) dd.classList.remove('show');
  if(n.action.type==='invoice'){ goTo('invoices'); setTimeout(()=>viewInvoice(n.action.id),80); }
  else if(n.action.type==='order'){ goTo('orders'); setTimeout(()=>viewOrder(n.action.id),80); }
  else if(n.action.type==='inventory'){ goTo('inventory'); }
}
function renderDashboardNotifRows(){
  const list=computeNotifications().slice(0,6);
  if(!list.length) return '<div class="empty-state" style="padding:22px;"><div class="t">No active alerts</div><div>Everything looks good right now.</div></div>';
  return list.map(n=>`
    <div class="dash-notif-row">
      <span class="dot-sev sev-${n.severity}" style="margin-top:6px;"></span>
      <div style="flex:1;min-width:0;">
        <div style="font-weight:700;font-size:12.6px;">${sevEmoji(n.severity)} ${n.title} — ${n.desc}</div>
        <div class="muted" style="font-size:11px;margin-top:2px;">${n.meta}</div>
      </div>
      <button class="btn btn-outline btn-sm" onclick="notifAction('${n.id}')">${escapeHtml(n.actionLabel)}</button>
    </div>
  `).join('');
}

/* ================= AI ASSISTANT ================= */
/* Local, rule-based business assistant. Reads directly from the
   existing `state` object (customers, orders, menuItems, invoices,
   payments, expenses, suppliers, inventory) — no API key, no network
   calls, no changes to any existing data structure. */

let aiOpen=false, aiHistory=[], aiGreeted=false;

const AI_QUICK_QUESTIONS=[
  ["Today's Orders","today's orders"],
  ["Pending Invoices","pending invoices"],
  ["Low Stock","low stock items"],
  ["This Month's Sales","this month's sales"],
  ["Outstanding Payments","outstanding payments"],
  ["Business Summary","business summary"]
];

function toggleAiAssistant(force){
  const win=document.getElementById('aiChatWindow');
  if(!win) return;
  const show = typeof force==='boolean' ? force : !win.classList.contains('show');
  win.classList.toggle('show',show);
  if(show){
    if(!aiGreeted){
      aiRenderQuickRow();
      aiPushMessage('bot', "Hi! I'm your Saffron Table assistant. Ask me about today's orders, pending invoices, low stock, sales, or anything else in your business data — I'll answer straight from your live records.");
      aiGreeted=true;
    }
    setTimeout(()=>document.getElementById('aiChatInput')?.focus(),100);
  }
}

function aiRenderQuickRow(){
  const row=document.getElementById('aiQuickRow');
  if(!row) return;
  row.innerHTML = AI_QUICK_QUESTIONS.map(([label,q])=>
    `<button class="ai-quick-btn" onclick="aiAsk('${q.replace(/'/g,"\\'")}')">${escapeHtml(label)}</button>`
  ).join('');
}

function aiAsk(text){
  const input=document.getElementById('aiChatInput');
  if(input) input.value=text;
  aiSendMessage();
}

function aiPushMessage(role,text){
  aiHistory.push({role,text});
  const body=document.getElementById('aiChatBody');
  if(!body) return;
  const div=document.createElement('div');
  div.className='ai-msg '+(role==='user'?'user':'bot');
  div.innerHTML=`<div class="ai-msg-avatar">${role==='user'?'You':'AI'}</div><div class="ai-msg-bubble">${text}</div>`;
  body.appendChild(div);
  body.scrollTop=body.scrollHeight;
}

function aiShowTyping(){
  const body=document.getElementById('aiChatBody');
  if(!body) return;
  const div=document.createElement('div');
  div.className='ai-msg bot'; div.id='aiTypingRow';
  div.innerHTML=`<div class="ai-msg-avatar">AI</div><div class="ai-msg-bubble"><div class="ai-typing"><span></span><span></span><span></span></div></div>`;
  body.appendChild(div);
  body.scrollTop=body.scrollHeight;
}
function aiHideTyping(){
  document.getElementById('aiTypingRow')?.remove();
}

function aiSendMessage(){
  const input=document.getElementById('aiChatInput');
  if(!input) return;
  const text=input.value.trim();
  if(!text) return;
  aiPushMessage('user', escapeHtml(text));
  input.value=''; input.style.height='auto';
  aiShowTyping();
  const sendBtn=document.getElementById('aiSendBtn');
  if(sendBtn) sendBtn.disabled=true;
  setTimeout(()=>{
    aiHideTyping();
    let answer;
    try{ answer=aiAnswer(text); }
    catch(err){ console.error('AI Assistant error',err); answer="Sorry, I ran into an issue reading that data. Please try rephrasing your question."; }
    aiPushMessage('bot', answer);
    if(sendBtn) sendBtn.disabled=false;
  }, 450+Math.random()*350);
}

/* ---- Business-data query engine (local, rule-based) ---- */
function aiAnswer(rawQuery){
  const q=rawQuery.toLowerCase();

  if(/\b(today'?s?\s*orders?|orders?\s*today|events?\s*today)\b/.test(q)) return aiTodayOrders();
  if(/\b(pending\s*invoices?|unpaid\s*invoices?|invoices?\s*pending)\b/.test(q)) return aiPendingInvoices();
  if(/\b(low\s*stock|out\s*of\s*stock|stock\s*items?|inventory\s*(low|alert))\b/.test(q)) return aiLowStock();
  if(/\b(this\s*month'?s?\s*sales|monthly\s*sales|sales\s*this\s*month|month'?s?\s*revenue)\b/.test(q)) return aiMonthSales();
  if(/\b(outstanding\s*payments?|payments?\s*outstanding|how\s*much\s*(payment|balance).*outstanding|total\s*outstanding)\b/.test(q)) return aiOutstandingPayments();
  if(/\b(business\s*summary|overall\s*summary|give\s*me\s*a\s*summary|summarize\s*my\s*business)\b/.test(q)) return aiBusinessSummary();
  if(/\bgst\b/.test(q)) return aiGstSummary();
  if(/\b(upcoming\s*events?|events?\s*upcoming|next\s*events?)\b/.test(q)) return aiUpcomingEvents();
  if(/\b(total\s*sales|total\s*revenue|all\s*time\s*sales)\b/.test(q)) return aiTotalSales();
  if(/\b(how\s*many\s*customers?|customer\s*count|total\s*customers?)\b/.test(q)) return aiCustomerCount();
  if(/\b(how\s*many\s*orders?|order\s*count|total\s*orders?)\b/.test(q) && !/today/.test(q)) return aiOrderCount();
  if(/\b(menu\s*items?|food\s*items?|dishes?)\b/.test(q)) return aiMenuSummary();
  if(/\b(suppliers?)\b/.test(q)) return aiSupplierSummary();
  if(/\b(expenses?)\b/.test(q)) return aiExpenseSummary();
  if(/\b(inventory|stock\s*value|stock\s*summary)\b/.test(q)) return aiInventorySummary();
  if(/\b(hi|hello|hey|namaste)\b/.test(q) && q.length<20) return "Hello! Ask me about orders, invoices, payments, stock, or your overall business — I'll pull the answer from your live data.";
  if(/\b(help|what can you do|capabilities)\b/.test(q)) return aiHelpText();

  return "I couldn't quite match that to a specific report. Try asking about:\n\n• Today's orders or upcoming events\n• Pending invoices or outstanding payments\n• Low stock items\n• This month's sales or total sales\n• Business summary\n• GST collected\n• Customers, suppliers, expenses, or inventory";
}

function aiTodayOrders(){
  const today=todayISO();
  const list=state.orders.filter(o=>o.eventDate===today && o.status!=='Cancelled');
  if(!list.length) return "You have no events scheduled for today ("+fmtDate(today)+").";
  let out="You have "+list.length+" event(s) today:\n\n";
  list.forEach(o=>{ out+="• "+escapeHtml(o.eventName)+" — "+escapeHtml(o.customerName)+" ("+o.guests+" guests) — "+o.status+"\n"; });
  return out;
}
function aiUpcomingEvents(){
  const today=todayISO();
  const list=state.orders.filter(o=>o.eventDate>=today && o.status!=='Cancelled').sort((a,b)=>a.eventDate.localeCompare(b.eventDate));
  if(!list.length) return "No upcoming events on the calendar right now.";
  let out="You have "+list.length+" upcoming event(s):\n\n";
  list.slice(0,10).forEach(o=>{ out+="• "+fmtDate(o.eventDate)+" — "+escapeHtml(o.eventName)+" ("+escapeHtml(o.customerName)+", "+o.guests+" guests)\n"; });
  if(list.length>10) out+="\n...and "+(list.length-10)+" more.";
  return out;
}
function aiPendingInvoices(){
  const list=state.invoices.filter(i=>i.status!=='Cancelled' && i.balance>0.01).sort((a,b)=>b.balance-a.balance);
  if(!list.length) return "No pending invoices — everything is settled!";
  const total=list.reduce((s,i)=>s+i.balance,0);
  let out="You have "+list.length+" pending invoice(s) totaling "+rupee(total)+":\n\n";
  list.slice(0,10).forEach(i=>{ out+="• "+i.invoiceNo+" — "+escapeHtml(i.customerName)+" — Balance "+rupee(i.balance)+" ("+i.status+")\n"; });
  if(list.length>10) out+="\n...and "+(list.length-10)+" more.";
  return out;
}
function aiLowStock(){
  const list=state.inventory.filter(i=>(i.closing||0)<=(i.minLevel||0));
  if(!list.length) return "All inventory items are above their minimum stock levels.";
  let out=list.length+" item(s) need attention:\n\n";
  list.forEach(i=>{
    out += (i.closing<=0)
      ? "• "+escapeHtml(i.name)+" — OUT OF STOCK\n"
      : "• "+escapeHtml(i.name)+" — Low: "+i.closing+" "+escapeHtml(i.unit||'')+" (minimum "+i.minLevel+" "+escapeHtml(i.unit||'')+")\n";
  });
  return out;
}
function aiMonthSales(){
  const now=new Date(); const ym=todayISO().slice(0,7);
  const list=state.invoices.filter(i=>i.status!=='Cancelled' && (i.invoiceDate||'').startsWith(ym));
  const total=list.reduce((s,i)=>s+i.grandTotal,0);
  const collected=list.reduce((s,i)=>s+(i.grandTotal-i.balance),0);
  const monthLabel=now.toLocaleDateString('en-IN',{month:'long',year:'numeric'});
  if(!list.length) return "No invoices billed yet in "+monthLabel+".";
  return "In "+monthLabel+", you've billed "+rupee(total)+" across "+list.length+" invoice(s).\nCollected so far: "+rupee(collected)+"\nOutstanding: "+rupee(total-collected);
}
function aiTotalSales(){
  const list=state.invoices.filter(i=>i.status!=='Cancelled');
  const total=list.reduce((s,i)=>s+i.grandTotal,0);
  const collected=list.reduce((s,i)=>s+(i.grandTotal-i.balance),0);
  return "All-time billed: "+rupee(total)+" across "+list.length+" invoice(s).\nCollected: "+rupee(collected)+"\nOutstanding: "+rupee(total-collected);
}
function aiOutstandingPayments(){
  const list=state.invoices.filter(i=>i.status!=='Cancelled' && i.balance>0.01);
  const total=list.reduce((s,i)=>s+i.balance,0);
  if(!list.length) return "No outstanding payments — all invoices are fully paid.";
  return "Total outstanding payments across "+list.length+" invoice(s): "+rupee(total)+".";
}
function aiGstSummary(){
  const list=state.invoices.filter(i=>i.status!=='Cancelled');
  const cgst=list.reduce((s,i)=>s+(i.cgst||0),0), sgst=list.reduce((s,i)=>s+(i.sgst||0),0), igst=list.reduce((s,i)=>s+(i.igst||0),0);
  return "GST collected across "+list.length+" invoice(s):\n\nCGST: "+rupee(cgst)+"\nSGST: "+rupee(sgst)+"\nIGST: "+rupee(igst)+"\nTotal GST: "+rupee(cgst+sgst+igst);
}
function aiCustomerCount(){
  return "You have "+state.customers.length+" customer(s) on record.";
}
function aiOrderCount(){
  const active=state.orders.filter(o=>o.status!=='Cancelled').length;
  return "You have "+state.orders.length+" total order(s), "+active+" of which are active (not cancelled).";
}
function aiMenuSummary(){
  const active=state.menuItems.filter(m=>m.active);
  return "Your menu has "+state.menuItems.length+" item(s), "+active.length+" currently active.";
}
function aiSupplierSummary(){
  if(!state.suppliers.length) return "No suppliers on record yet.";
  const totalOutstanding=state.suppliers.reduce((s,x)=>s+(x.outstanding||0),0);
  return "You have "+state.suppliers.length+" supplier(s) on record.\nTotal outstanding to suppliers: "+rupee(totalOutstanding);
}
function aiExpenseSummary(){
  const ym=todayISO().slice(0,7);
  const monthList=state.expenses.filter(e=>(e.date||'').startsWith(ym));
  const monthTotal=monthList.reduce((s,e)=>s+(e.amount||0),0);
  const allTotal=state.expenses.reduce((s,e)=>s+(e.amount||0),0);
  return "This month's expenses: "+rupee(monthTotal)+" ("+monthList.length+" entries)\nAll-time expenses: "+rupee(allTotal)+" ("+state.expenses.length+" entries)";
}
function aiInventorySummary(){
  const low=state.inventory.filter(i=>(i.closing||0)<=(i.minLevel||0)).length;
  return "You're tracking "+state.inventory.length+" inventory item(s), "+low+" of which are at or below minimum stock.";
}
function aiBusinessSummary(){
  const totalCustomers=state.customers.length;
  const activeOrders=state.orders.filter(o=>o.status!=='Cancelled').length;
  const upcoming=state.orders.filter(o=>o.eventDate>=todayISO() && o.status!=='Cancelled').length;
  const totalInvoices=state.invoices.length;
  const nonCancelled=state.invoices.filter(i=>i.status!=='Cancelled');
  const totalBilled=nonCancelled.reduce((s,i)=>s+i.grandTotal,0);
  const totalCollected=nonCancelled.reduce((s,i)=>s+(i.grandTotal-i.balance),0);
  const outstanding=totalBilled-totalCollected;
  const lowStockCount=state.inventory.filter(i=>(i.closing||0)<=(i.minLevel||0)).length;
  return "Business Summary\n\nCustomers: "+totalCustomers+"\nActive Orders: "+activeOrders+"\nUpcoming Events: "+upcoming+"\nTotal Invoices: "+totalInvoices+"\nTotal Billed: "+rupee(totalBilled)+"\nCollected: "+rupee(totalCollected)+"\nOutstanding: "+rupee(outstanding)+"\nLow Stock Items: "+lowStockCount;
}
function aiHelpText(){
  return "I can answer questions about:\n\n• Customers, orders & events\n• Invoices & payments (pending, outstanding, monthly/total sales)\n• GST collected\n• Menu items\n• Suppliers & expenses\n• Inventory & low stock\n\nTry the quick buttons above, or just type a question in plain English.";
}

document.getElementById('aiChatInput')?.addEventListener('keydown', function(e){
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); aiSendMessage(); }
});
document.getElementById('aiChatInput')?.addEventListener('input', function(){
  this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,80)+'px';
});
